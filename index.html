<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <script src="https://cdn.jsdelivr.net/npm/canvas-confetti@1.6.0/dist/confetti.browser.min.js"></script>
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Inter:wght@300;400;500;600&family=JetBrains+Mono:wght@400;500&display=swap" rel="stylesheet">
    <style>
        body {
            font-family: 'Inter', sans-serif;
        }

        textarea::-webkit-scrollbar,
        #markdownPreview::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track,
        #markdownPreview::-webkit-scrollbar-track {
            background: #1f2937;
        }

        textarea::-webkit-scrollbar-thumb,
        #markdownPreview::-webkit-scrollbar-thumb {
            background: #525252;
        }

        textarea::-webkit-scrollbar-thumb:hover,
        #markdownPreview::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        #markdownPreview {
            overflow-y: auto;
        }

        #markdownPreview h1 {
            font-size: 2em;
            font-weight: bold;
            margin: 0.67em 0;
        }

        #markdownPreview h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin: 0.75em 0;
        }

        #markdownPreview h3 {
            font-size: 1.17em;
            font-weight: bold;
            margin: 0.83em 0;
        }

        #markdownPreview p {
            margin: 1em 0;
        }

        #markdownPreview ul, #markdownPreview ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        #markdownPreview li {
            margin: 0.5em 0;
        }

        #markdownPreview code {
            background-color: #262626;
            padding: 0.2em 0.4em;
            font-family: 'JetBrains Mono', monospace;
        }

        #markdownPreview pre {
            background-color: #171717;
            padding: 1em;
            overflow-x: auto;
            margin: 1em 0;
        }

        #markdownPreview pre code {
            background-color: transparent;
            padding: 0;
        }

        #markdownPreview blockquote {
            border-left: 4px solid #4b5563;
            padding-left: 1em;
            margin: 1em 0;
            color: #9ca3af;
        }

        #markdownPreview a {
            color: #e5e7eb;
            text-decoration: underline;
        }

        #markdownPreview hr {
            border: none;
            border-top: 1px solid #4b5563;
            margin: 2em 0;
        }

        /* Floating Notes Panel Transition */
        #floatingNotesPanel {
            transition: opacity 0.3s ease, transform 0.3s ease;
        }

        #floatingNotesPanel.visible {
            opacity: 1;
            transform: translateX(0);
        }

        .modal {
            display: flex;
            visibility: hidden;
            pointer-events: none;
            align-items: center;
            justify-content: center;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.6);
            backdrop-filter: blur(4px);
            opacity: 0;
            transition: opacity 0.4s ease-in-out, visibility 0.4s ease-in-out;
        }

        .modal.active {
            visibility: visible;
            pointer-events: auto;
            opacity: 1;
        }

        .modal-content {
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal.active .modal-content {
            transform: translateY(0);
            opacity: 1;
        }

        /* Tab Dropdown Backdrop */
        .tab-dropdown-backdrop {
            position: fixed;
            inset: 0;
            z-index: 9998;
            display: none;
            background: transparent;
        }

        .tab-dropdown-backdrop.active {
            display: block;
        }

        .dropdown-menu {
            position: absolute;
            background-color: #171717;
            border: 1px solid #262626;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            width: 260px;
            max-height: 60vh;
            overflow-y: auto;
            z-index: 9999;
            border-radius: 0.75rem;
            transform-origin: top left;
            transform: scale(0.95) translateY(-5px);
            opacity: 0;
            visibility: hidden;
            transition: all 0.2s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .dropdown-menu.active {
            transform: scale(1) translateY(0);
            opacity: 1;
            visibility: visible;
        }

        .dropdown-menu::-webkit-scrollbar {
            width: 6px;
        }

        .dropdown-menu::-webkit-scrollbar-track {
            background: #171717;
            border-radius: 0.75rem;
        }

        .dropdown-menu::-webkit-scrollbar-thumb {
            background: #404040;
            border-radius: 10px;
        }

        .dropdown-menu::-webkit-scrollbar-thumb:hover {
            background: #525252;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 0.75rem 1rem;
            color: #d4d4d4;
            cursor: pointer;
            transition: all 0.2s ease-in-out;
            font-size: 0.875rem;
            border-bottom: 1px solid #262626;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: #262626;
            color: white;
        }

        .dropdown-item.active {
            background-color: #262626;
            color: white;
            font-weight: 500;
        }

        .dropdown-item.new-tab {
            color: #a3a3a3;
            font-weight: 500;
            border-top: 1px solid #262626;
            background-color: #171717;
            padding: 0.75rem 1rem;
        }

        .dropdown-item.new-tab:hover {
            background-color: #262626;
            color: white;
        }

        .tab-actions {
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .dropdown-item:hover .tab-actions {
            opacity: 1;
        }

        .action-btn {
            padding: 0.5rem;
            transition: all 0.2s ease-in-out;
        }

        .action-btn:hover {
            background-color: #6b7280;
        }

        .action-btn.delete:hover {
            background-color: #dc2626;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-item {
            animation: slideIn 0.2s ease forwards;
        }

        .dropdown-item:nth-child(1) { animation-delay: 0.02s; }
        .dropdown-item:nth-child(2) { animation-delay: 0.04s; }
        .dropdown-item:nth-child(3) { animation-delay: 0.06s; }
        .dropdown-item:nth-child(4) { animation-delay: 0.08s; }
        .dropdown-item:nth-child(5) { animation-delay: 0.10s; }

        /* Focus Mode Overrides */
        body.focus-mode {
            padding: 0 !important;
        }

        body.focus-mode #appContainer {
            max-width: 100vw !important;
            height: 100vh !important;
            width: 100vw !important;
            border: none !important;
            box-shadow: none !important;
        }

        body.focus-mode #counterBar {
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        body.focus-mode #counterBar:hover {
            opacity: 1;
        }

        .scrollbar-hide::-webkit-scrollbar {
            display: none;
        }
        .scrollbar-hide {
            -ms-overflow-style: none;
            scrollbar-width: none;
        }

        /* Highlight & Tooltip Styles */
        mark {
            background-color: #ca8a04; /* yellow-600 - darker for better contrast in dark mode? or maybe just yellow-500 */
            color: #fff;
            padding: 0 0.2em;
            border-radius: 0.2em;
        }

        /* In preview mode, mark might need better contrast depending on theme.
           Let's use a amber-500/30 background for a subtler highlight that fits dark mode */
        #markdownPreview mark {
            background-color: rgba(245, 158, 11, 0.3); /* amber-500 with opacity */
            color: #fcd34d; /* amber-300 */
            border: 1px solid rgba(245, 158, 11, 0.4);
        }

        .note-tooltip {
            text-decoration: underline;
            text-decoration-style: dotted;
            text-decoration-color: #fbbf24;
            cursor: help;
            position: relative;
        }

        .note-tooltip:hover::after {
            content: attr(data-msg);
            position: absolute;
            bottom: 100%;
            left: 50%;
            transform: translateX(-50%) translateY(-5px);
            background-color: #171717;
            border: 1px solid #404040;
            color: #e5e5e5;
            padding: 0.5rem 0.75rem;
            border-radius: 0.5rem;
            font-size: 0.875rem;
            white-space: nowrap;
            z-index: 50;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5);
            pointer-events: none;
            animation: slideIn 0.2s ease forwards;
        }
    </style>
</head>
<body class="bg-[radial-gradient(ellipse_at_top,_var(--tw-gradient-stops))] from-gray-900 via-[#0a0a0a] to-black min-h-screen flex items-center justify-center p-4 md:p-8 selection:bg-indigo-500/30 text-gray-200">
    <div class="absolute top-6 left-8 font-mono font-thin text-gray-400 text-sm pointer-events-none select-none">Minimalist Notepad</div>
    <div id="appContainer" class="w-full max-w-4xl h-[90vh] flex flex-col bg-black/40 backdrop-blur-2xl shadow-2xl overflow-hidden border border-white/5 transition-all duration-500 ease-in-out ring-1 ring-white/5">

        <!-- Counter Bar -->
        <div id="counterBar" class="relative flex items-center px-6 py-4 border-b border-white/5 bg-transparent backdrop-blur-sm transition-all duration-300 ease-in-out group/bar">

            <!-- Left Arrow -->
            <button id="scrollLeftBtn" class="absolute left-0 z-10 h-full px-2 bg-gradient-to-r from-black/80 to-transparent hidden items-center justify-center text-neutral-400 hover:text-white transition-opacity">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 19l-7-7 7-7"></path>
                </svg>
            </button>

            <!-- Scrollable Content -->
            <div id="counterBarScroll" class="flex-1 flex items-center justify-between overflow-x-auto scrollbar-hide">
                <div class="flex items-center gap-6 shrink-0">
                     <!-- Tab Switcher -->
                    <button id="tabDropdownTrigger" class="flex items-center gap-2 px-3 py-1.5 -ml-2 rounded-lg hover:bg-white/10 transition-all duration-200 text-neutral-300 hover:text-white group focus:outline-none focus:ring-1 focus:ring-neutral-700" title="Switch notes">
                        <span class="font-medium max-w-[150px] truncate text-sm" id="currentTabName">Note 1</span>
                        <svg id="tabDropdownChevron" class="w-3.5 h-3.5 text-neutral-500 group-hover:text-white transition-transform duration-200" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 9l-7 7-7-7"></path>
                        </svg>
                    </button>
                    <div class="h-4 w-px bg-white/10"></div>

                    <!-- Character Counter -->
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                        </svg>
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-neutral-200 font-semibold tabular-nums tracking-wide" id="charCount">0</span>
                            </div>
                            <div id="charProgress" class="hidden h-1 w-32 bg-neutral-800 rounded-full overflow-hidden">
                                <div id="charProgressBar" class="h-full bg-white transition-all duration-500 ease-out" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Word Counter -->
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                        </svg>
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-neutral-200 font-semibold tabular-nums tracking-wide" id="wordCount">0</span>
                            </div>
                            <div id="wordProgress" class="hidden h-1 w-32 bg-neutral-800 rounded-full overflow-hidden">
                                <div id="wordProgressBar" class="h-full bg-white transition-all duration-500 ease-out" style="width: 0%"></div>
                            </div>
                        </div>
                    </div>

                    <!-- Timer -->
                    <div class="flex items-center gap-3">
                        <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                        </svg>
                        <div class="flex flex-col gap-1">
                            <div class="flex items-center gap-2">
                                <span class="text-sm text-neutral-200 font-semibold tabular-nums tracking-wide" id="timerDisplay">00:00</span>
                            </div>
                        </div>
                        <button id="timerToggleBtn" class="flex items-center justify-center w-6 h-6 rounded-full hover:bg-white/10 text-neutral-400 hover:text-white transition-colors" title="Start/Stop Timer">
                            <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" id="timerIcon">
                                <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
                            </svg>
                        </button>
                        <button id="timerResetBtn" class="flex items-center justify-center w-6 h-6 rounded-full hover:bg-white/10 text-neutral-400 hover:text-white transition-colors" title="Reset Timer">
                            <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 4v5h.582m15.356 2A8.001 8.001 0 004.582 9m0 0H9m11 11v-5h-.581m0 0a8.003 8.003 0 01-15.357-2m15.357 2H15"></path>
                            </svg>
                        </button>
                    </div>

                    <!-- Goal Settings Button -->
                    <button id="goalSettingsBtn" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-2 py-1.5 rounded hover:bg-white/5" title="Set goals">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                        </svg>
                    </button>
                </div>

                <div class="flex items-center gap-4 shrink-0">
                    <!-- Floating Notes Toggle -->
                    <button id="floatingNotesToggle" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-3 py-1.5 rounded hover:bg-white/5" title="Toggle floating notes">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 20H5a2 2 0 01-2-2V6a2 2 0 012-2h10a2 2 0 012 2v1m2 13a2 2 0 01-2-2V7m2 13a2 2 0 002-2V9a2 2 0 00-2-2h-2m-4-3H9M7 16h6M7 8h6v4H7V8z"></path>
                        </svg>
                    </button>

                    <!-- Focus Toggle -->
                    <button id="focusToggle" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-3 py-1.5 rounded hover:bg-white/5" title="Toggle focus mode">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                        </svg>
                    </button>

                    <!-- Formatting Menu Toggle -->
                    <button id="formatMenuToggle" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-3 py-1.5 rounded hover:bg-white/5" title="Formatting">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16m-7 6h7"></path>
                        </svg>
                    </button>

                    <!-- Markdown Toggle -->
                    <button id="markdownToggle" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-3 py-1.5 rounded hover:bg-white/5" title="Toggle preview">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                        </svg>
                    </button>

                    <!-- Auto-save indicator -->
                    <div class="flex items-center gap-2 text-xs text-gray-500" title="Auto-saved">
                        <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                            <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                        </svg>
                    </div>
                </div>
            </div>

            <!-- Right Arrow -->
            <button id="scrollRightBtn" class="absolute right-0 z-10 h-full px-2 bg-gradient-to-l from-black/80 to-transparent hidden items-center justify-center text-neutral-400 hover:text-white transition-opacity">
                <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 5l7 7-7 7"></path>
                </svg>
            </button>
        </div>

        <!-- Editor/Preview Container -->
        <div class="flex-1 relative overflow-hidden group">
            <!-- Textarea -->
            <textarea
                id="notepad"
                placeholder="Start typing..."
                autofocus
                class="absolute inset-0 w-full h-full bg-transparent text-gray-100 placeholder-neutral-600 px-8 py-6 text-base md:text-lg leading-relaxed resize-none outline-none focus:ring-0 font-mono transition-colors duration-300"
                style="font-family: 'JetBrains Mono', monospace;"
            ></textarea>

            <!-- Markdown Preview -->
            <div id="markdownPreview" class="absolute inset-0 w-full h-full bg-transparent text-gray-100 px-8 py-6 text-base md:text-lg leading-relaxed hidden">
            </div>

            <!-- Floating Notes Panel -->
            <div id="floatingNotesPanel" class="absolute top-6 right-6 w-72 bottom-6 z-20 pointer-events-none flex flex-col gap-3 opacity-0 translate-x-4 hidden">
                <div class="flex items-center justify-between pointer-events-auto bg-neutral-900/80 backdrop-blur-md p-3 rounded-xl border border-white/10 shadow-lg">
                    <span class="text-xs font-semibold text-gray-400 pl-1 uppercase tracking-wider">Scratchpad</span>
                    <button id="addNoteBtn" class="p-1.5 hover:bg-white/10 rounded-lg text-gray-400 hover:text-white transition-colors" title="Add note">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path></svg>
                    </button>
                </div>
                <div id="notesList" class="flex-1 overflow-y-auto pointer-events-auto space-y-3 pr-1 pb-2">
                    <!-- Notes rendered here -->
                </div>
            </div>
        </div>
    </div>

    <!-- Tab Dropdown Backdrop and Menu (at body level) -->
    <div class="tab-dropdown-backdrop" id="tabDropdownBackdrop"></div>
    <div class="dropdown-menu" id="dropdownMenu">
        <!-- Tabs will be inserted here -->
    </div>

    <!-- Formatting Menu -->
    <div class="dropdown-menu" id="formatMenu" style="width: 200px;">
        <div class="dropdown-item" id="btnFormatBold">
            <div class="flex items-center gap-2">
                <span class="font-bold">B</span>
                <span>Bold</span>
            </div>
            <span class="text-xs text-neutral-500">Ctrl+B</span>
        </div>
        <div class="dropdown-item" id="btnFormatHighlight">
             <div class="flex items-center gap-2">
                <span class="bg-yellow-600 text-white text-xs px-1 rounded">H</span>
                <span>Highlight</span>
            </div>
        </div>
        <div class="dropdown-item" id="btnFormatMessage">
             <div class="flex items-center gap-2">
                <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M7 8h10M7 12h4m1 8l-4-4H5a2 2 0 01-2-2V6a2 2 0 012-2h14a2 2 0 012 2v8a2 2 0 01-2 2h-3l-4 4z"></path></svg>
                <span>Add Message</span>
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div id="renameModal" class="modal">
        <div class="modal-content bg-neutral-900 rounded-xl p-6 w-full max-w-md border border-neutral-800 shadow-2xl">
            <h3 class="text-xl font-semibold text-white mb-4">Rename Tab</h3>
            <input
                type="text"
                id="renameInput"
                class="w-full bg-neutral-950 text-neutral-200 px-4 py-3 rounded-lg border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-700 mb-4 placeholder-neutral-600"
                placeholder="Enter tab name..."
            />
            <div class="flex justify-end gap-3">
                <button id="cancelRenameBtn" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-lg transition-colors border border-neutral-700">
                    Cancel
                </button>
                <button id="confirmRenameBtn" class="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-900 font-semibold rounded-lg transition-colors">
                    Rename
                </button>
            </div>
        </div>
    </div>

    <!-- Add Message Modal -->
    <div id="messageModal" class="modal">
        <div class="modal-content bg-neutral-900 rounded-xl p-6 w-full max-w-md border border-neutral-800 shadow-2xl">
            <h3 class="text-xl font-semibold text-white mb-4">Add Message to Selection</h3>
            <input
                type="text"
                id="messageInput"
                class="w-full bg-neutral-950 text-neutral-200 px-4 py-3 rounded-lg border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-700 mb-4 placeholder-neutral-600"
                placeholder="Enter message..."
            />
            <div class="flex justify-end gap-3">
                <button id="cancelMessageBtn" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-lg transition-colors border border-neutral-700">
                    Cancel
                </button>
                <button id="confirmMessageBtn" class="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-900 font-semibold rounded-lg transition-colors">
                    Add Message
                </button>
            </div>
        </div>
    </div>

    <!-- Goal Settings Modal -->
    <div id="goalModal" class="modal">
        <div class="modal-content bg-neutral-900 rounded-xl p-6 w-full max-w-md border border-neutral-800 shadow-2xl">
            <h3 class="text-xl font-semibold text-white mb-4">Set Goals for This Note</h3>
            <p class="text-sm text-neutral-400 mb-4">Set optional word and character count goals. Leave blank or set to 0 to remove a goal.</p>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm text-neutral-300 mb-2">Character Goal</label>
                    <input
                        type="number"
                        id="charGoalInput"
                        min="0"
                        class="w-full bg-neutral-950 text-neutral-200 px-4 py-3 rounded-lg border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-700 placeholder-neutral-600"
                        placeholder="e.g., 1000"
                    />
                </div>

                <div>
                    <label class="block text-sm text-neutral-300 mb-2">Word Goal</label>
                    <input
                        type="number"
                        id="wordGoalInput"
                        min="0"
                        class="w-full bg-neutral-950 text-neutral-200 px-4 py-3 rounded-lg border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-700 placeholder-neutral-600"
                        placeholder="e.g., 200"
                    />
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button id="cancelGoalBtn" class="px-4 py-2 bg-neutral-800 hover:bg-neutral-700 text-neutral-300 rounded-lg transition-colors border border-neutral-700">
                    Cancel
                </button>
                <button id="confirmGoalBtn" class="px-4 py-2 bg-neutral-100 hover:bg-white text-neutral-900 font-semibold rounded-lg transition-colors">
                    Save Goals
                </button>
            </div>
        </div>
    </div>

    <script>
        // Floating Notes Management
        class FloatingNotesManager {
            constructor() {
                this.notes = [];
                this.isVisible = false;
                this.loadNotes();
                this.init();
            }

            init() {
                const toggleBtn = document.getElementById('floatingNotesToggle');
                const addBtn = document.getElementById('addNoteBtn');
                const panel = document.getElementById('floatingNotesPanel');

                if (toggleBtn) {
                    toggleBtn.addEventListener('click', () => this.toggleVisibility());
                }

                if (addBtn) {
                    addBtn.addEventListener('click', () => this.createNote());
                }

                this.renderNotes();

                // Restore visibility state
                const savedVisibility = localStorage.getItem('floatingNotesVisible');
                if (savedVisibility === 'true') {
                    this.toggleVisibility(true);
                }
            }

            loadNotes() {
                const savedNotes = localStorage.getItem('floatingNotes');
                if (savedNotes) {
                    this.notes = JSON.parse(savedNotes);
                }
            }

            saveNotes() {
                localStorage.setItem('floatingNotes', JSON.stringify(this.notes));
            }

            toggleVisibility(forceShow = null) {
                const panel = document.getElementById('floatingNotesPanel');
                const toggleBtn = document.getElementById('floatingNotesToggle');

                if (forceShow !== null) {
                    this.isVisible = forceShow;
                } else {
                    this.isVisible = !this.isVisible;
                }

                localStorage.setItem('floatingNotesVisible', this.isVisible);

                if (this.isVisible) {
                    panel.classList.remove('hidden');
                    // Small delay to allow display:block to apply before transition
                    requestAnimationFrame(() => {
                        panel.classList.add('visible');
                    });
                    toggleBtn.classList.add('text-white', 'bg-white/5');
                } else {
                    panel.classList.remove('visible');
                    setTimeout(() => {
                        if (!this.isVisible) panel.classList.add('hidden');
                    }, 300); // Match transition duration
                    toggleBtn.classList.remove('text-white', 'bg-white/5');
                }
            }

            createNote() {
                const newNote = {
                    id: Date.now().toString(),
                    content: '',
                    color: 'bg-neutral-800/90' // Default color
                };
                this.notes.unshift(newNote); // Add to top
                this.saveNotes();
                this.renderNotes();

                // Focus the new note
                setTimeout(() => {
                    const textarea = document.querySelector(`textarea[data-note-id="${newNote.id}"]`);
                    if (textarea) textarea.focus();
                }, 50);
            }

            deleteNote(noteId) {
                this.notes = this.notes.filter(n => n.id !== noteId);
                this.saveNotes();
                this.renderNotes();
            }

            updateNote(noteId, content) {
                const note = this.notes.find(n => n.id === noteId);
                if (note) {
                    note.content = content;
                    this.saveNotes();
                }
            }

            renderNotes() {
                const list = document.getElementById('notesList');
                list.innerHTML = '';

                this.notes.forEach(note => {
                    const noteEl = document.createElement('div');
                    noteEl.className = `group relative ${note.color} backdrop-blur-sm p-3 rounded-xl border border-white/5 shadow-lg transition-all hover:border-white/20`;

                    const textarea = document.createElement('textarea');
                    textarea.className = 'w-full h-24 bg-transparent text-sm text-gray-300 placeholder-gray-600 resize-none outline-none font-mono leading-relaxed scrollbar-hide';
                    textarea.setAttribute('data-note-id', note.id);
                    textarea.placeholder = 'Type a note...';
                    textarea.value = note.content; // Safe assignment preventing XSS

                    textarea.addEventListener('input', (e) => {
                        this.updateNote(note.id, e.target.value);
                    });

                    const deleteBtn = document.createElement('button');
                    deleteBtn.className = 'absolute top-2 right-2 opacity-0 group-hover:opacity-100 p-1 hover:bg-red-500/20 rounded text-gray-500 hover:text-red-400 transition-all duration-200';
                    deleteBtn.title = 'Delete note';
                    deleteBtn.innerHTML = '<svg class="w-3 h-3" fill="none" stroke="currentColor" viewBox="0 0 24 24"><path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path></svg>';
                    deleteBtn.addEventListener('click', () => this.deleteNote(note.id));

                    noteEl.appendChild(textarea);
                    noteEl.appendChild(deleteBtn);
                    list.appendChild(noteEl);
                });
            }
        }

        window.floatingNotesManager = new FloatingNotesManager();

        // Tab Management
        class TabManager {
            constructor() {
                this.tabs = [];
                this.activeTabId = null;
                this.loadTabs();
                this.init();
            }

            init() {
                if (this.tabs.length === 0) {
                    this.createTab();
                } else {
                    this.activeTabId = this.tabs[0].id;
                    this.renderDropdown();
                    this.loadActiveTab();
                }
            }

            loadTabs() {
                const savedTabs = localStorage.getItem('notepadTabs');
                if (savedTabs) {
                    this.tabs = JSON.parse(savedTabs);
                }
                const savedActiveTab = localStorage.getItem('activeTabId');
                if (savedActiveTab) {
                    this.activeTabId = savedActiveTab;
                }
            }

            saveTabs() {
                localStorage.setItem('notepadTabs', JSON.stringify(this.tabs));
                localStorage.setItem('activeTabId', this.activeTabId);
            }

            createTab() {
                const newTab = {
                    id: Date.now().toString(),
                    title: `Note ${this.tabs.length + 1}`,
                    content: '',
                    charGoal: null,
                    wordGoal: null
                };
                this.tabs.push(newTab);
                this.activeTabId = newTab.id;
                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
                updateCounters(this);
            }

            setGoals(tabId, charGoal, wordGoal) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (tab) {
                    tab.charGoal = charGoal > 0 ? charGoal : null;
                    tab.wordGoal = wordGoal > 0 ? wordGoal : null;
                    this.saveTabs();
                    updateCounters(this);
                }
            }

            switchTab(tabId) {
                // Save current tab content before switching
                this.saveCurrentTabContent();
                this.activeTabId = tabId;
                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
            }

            renameTab(tabId, newTitle) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (tab && newTitle.trim()) {
                    tab.title = newTitle.trim();
                    this.saveTabs();
                    this.renderDropdown();
                    if (this.activeTabId === tabId) {
                        const currentTabName = document.getElementById('currentTabName');
                        if (currentTabName) {
                            currentTabName.textContent = tab.title;
                        }
                    }
                }
            }

            deleteTab(tabId) {
                if (this.tabs.length === 1) {
                    alert('Cannot delete the last tab');
                    return;
                }

                const tabIndex = this.tabs.findIndex(t => t.id === tabId);
                this.tabs.splice(tabIndex, 1);

                // Switch to another tab
                if (this.activeTabId === tabId) {
                    const newActiveIndex = Math.min(tabIndex, this.tabs.length - 1);
                    this.activeTabId = this.tabs[newActiveIndex].id;
                }

                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
            }

            saveCurrentTabContent() {
                const activeTab = this.tabs.find(t => t.id === this.activeTabId);
                if (activeTab) {
                    activeTab.content = notepad.value;
                    this.saveTabs();
                }
            }

            loadActiveTab() {
                const activeTab = this.tabs.find(t => t.id === this.activeTabId);
                if (activeTab) {
                    notepad.value = activeTab.content;

                    const currentTabName = document.getElementById('currentTabName');
                    if (currentTabName) {
                        currentTabName.textContent = activeTab.title;
                    }

                    updateCounters(this);
                    updateMarkdownPreview();
                }
            }

            renderDropdown() {
                const dropdownMenu = document.getElementById('dropdownMenu');

                // Render tab items
                const tabItems = this.tabs.map(tab => `
                    <div class="dropdown-item ${tab.id === this.activeTabId ? 'active' : ''}" data-tab-id="${tab.id}">
                        <span class="flex-1 truncate">${tab.title}</span>
                        <div class="tab-actions">
                            <button class="action-btn rename" data-tab-id="${tab.id}" title="Rename">
                                <svg class="w-3.5 h-3.5 text-neutral-400 hover:text-white" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                </svg>
                            </button>
                            <button class="action-btn delete" data-tab-id="${tab.id}" title="Delete">
                                <svg class="w-3.5 h-3.5 text-neutral-400 hover:text-red-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `).join('');

                // Add new tab button
                const newTabButton = `
                    <div class="dropdown-item new-tab" id="newTabBtn">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>New Tab</span>
                    </div>
                `;

                dropdownMenu.innerHTML = tabItems + newTabButton;

                // Attach event listeners
                this.attachDropdownListeners();
            }

            attachDropdownListeners() {

                // Tab click to switch
                document.querySelectorAll('.dropdown-item:not(.new-tab)').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (!e.target.closest('.action-btn')) {
                            const tabId = item.getAttribute('data-tab-id');
                            this.switchTab(tabId);
                            closeDropdown();
                        }
                    });
                });

                // Rename buttons
                document.querySelectorAll('.action-btn.rename').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const tabId = btn.getAttribute('data-tab-id');
                        openRenameModal(tabId);
                        closeDropdown();
                    });
                });

                // Delete buttons
                document.querySelectorAll('.action-btn.delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const tabId = btn.getAttribute('data-tab-id');
                        if (confirm('Are you sure you want to delete this tab?')) {
                            this.deleteTab(tabId);
                        }
                    });
                });

                // New tab button
                const newTabBtn = document.getElementById('newTabBtn');
                if (newTabBtn) {
                    newTabBtn.addEventListener('click', () => {
                        this.createTab();
                        closeDropdown();
                    });
                }
            }

            getActiveTab() {
                return this.tabs.find(t => t.id === this.activeTabId);
            }
        }

        // Initialize
        const notepad = document.getElementById('notepad');
        const markdownPreview = document.getElementById('markdownPreview');
        const markdownToggle = document.getElementById('markdownToggle');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const tabDropdownTrigger = document.getElementById('tabDropdownTrigger');
        const tabDropdownBackdrop = document.getElementById('tabDropdownBackdrop');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const renameModal = document.getElementById('renameModal');
        const renameInput = document.getElementById('renameInput');
        const confirmRenameBtn = document.getElementById('confirmRenameBtn');
        const cancelRenameBtn = document.getElementById('cancelRenameBtn');
        const goalModal = document.getElementById('goalModal');
        const goalSettingsBtn = document.getElementById('goalSettingsBtn');
        const charGoalInput = document.getElementById('charGoalInput');
        const wordGoalInput = document.getElementById('wordGoalInput');
        const confirmGoalBtn = document.getElementById('confirmGoalBtn');
        const cancelGoalBtn = document.getElementById('cancelGoalBtn');
        const focusToggle = document.getElementById('focusToggle');
        const formatMenuToggle = document.getElementById('formatMenuToggle');
        const formatMenu = document.getElementById('formatMenu');
        const btnFormatBold = document.getElementById('btnFormatBold');
        const btnFormatHighlight = document.getElementById('btnFormatHighlight');
        const btnFormatMessage = document.getElementById('btnFormatMessage');
        const messageModal = document.getElementById('messageModal');
        const messageInput = document.getElementById('messageInput');
        const confirmMessageBtn = document.getElementById('confirmMessageBtn');
        const cancelMessageBtn = document.getElementById('cancelMessageBtn');
        const appContainer = document.getElementById('appContainer');
        const counterBar = document.getElementById('counterBar');
        let saveTimeout;
        let isPreviewMode = false;
        let isFocusMode = false;
        let currentRenameTabId = null;
        let confettiTriggered = false; // To prevent continuous confetti
        let currentMessageSelection = null;

        const quotes = [
            "The secret of getting ahead is getting started.",
            "It always seems impossible until it's done.",
            "Don't watch the clock; do what it does. Keep going.",
            "Believe you can and you're halfway there.",
            "Your limitation—it's only your imagination.",
            "Push yourself, because no one else is going to do it for you.",
            "Great things never come from comfort zones.",
            "Dream it. Wish it. Do it.",
            "Success doesn't just find you. You have to go out and get it.",
            "The harder you work for something, the greater you'll feel when you achieve it.",
            "Dream bigger. Do bigger.",
            "Don't stop when you're tired. Stop when you're done.",
            "Do something today that your future self will thank you for.",
            "Little things make big days.",
            "It's going to be hard, but hard does not mean impossible.",
            "Don't wait for opportunity. Create it.",
            "Sometimes we're tested not to show our weaknesses, but to discover our strengths.",
            "The key to success is to focus on goals, not obstacles.",
            "Dream it. Believe it. Build it.",
            "Write it on your heart that every day is the best day in the year."
        ];

        function setRandomPlaceholder() {
            const randomQuote = quotes[Math.floor(Math.random() * quotes.length)];
            notepad.setAttribute('placeholder', randomQuote);
        }

        const tabManager = new TabManager();
        setRandomPlaceholder();

        // Tab dropdown toggle
        tabDropdownTrigger.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = dropdownMenu.classList.contains('active');
            if (isActive) {
                closeDropdown();
            } else {
                openDropdown();
            }
        });

        function openDropdown() {
            // Position the dropdown
            const rect = tabDropdownTrigger.getBoundingClientRect();
            dropdownMenu.style.top = `${rect.bottom + 8}px`;
            dropdownMenu.style.left = `${rect.left}px`;

            tabDropdownBackdrop.classList.add('active');
            dropdownMenu.classList.add('active');

            // Rotate chevron
            const chevron = document.getElementById('tabDropdownChevron');
            if (chevron) chevron.style.transform = 'rotate(180deg)';
        }

        function closeDropdown() {
            tabDropdownBackdrop.classList.remove('active');
            dropdownMenu.classList.remove('active');

            // Reset chevron
            const chevron = document.getElementById('tabDropdownChevron');
            if (chevron) chevron.style.transform = 'rotate(0deg)';
        }

        // Close dropdowns when clicking backdrop
        tabDropdownBackdrop.addEventListener('click', (e) => {
            closeDropdown();
            closeFormatMenu();
        });

        // Handle resize to reposition if open
        window.addEventListener('resize', () => {
            if (dropdownMenu.classList.contains('active')) {
                 const rect = tabDropdownTrigger.getBoundingClientRect();
                 dropdownMenu.style.top = `${rect.bottom + 8}px`;
                 dropdownMenu.style.left = `${rect.left}px`;
            }
            if (formatMenu.classList.contains('active')) {
                 const rect = formatMenuToggle.getBoundingClientRect();
                 formatMenu.style.top = `${rect.bottom + 8}px`;
                 formatMenu.style.left = `${rect.left}px`;
            }
        });

        // Rename modal functions
        function openRenameModal(tabId) {
            currentRenameTabId = tabId;
            const tab = tabManager.tabs.find(t => t.id === tabId);
            if (tab) {
                renameInput.value = tab.title;
                renameModal.classList.add('active');
                setTimeout(() => {
                    renameInput.focus();
                    renameInput.select();
                }, 100);
            }
        }

        confirmRenameBtn.addEventListener('click', () => {
            const newTitle = renameInput.value.trim();
            if (newTitle && currentRenameTabId) {
                tabManager.renameTab(currentRenameTabId, newTitle);
                renameModal.classList.remove('active');
                currentRenameTabId = null;
            }
        });

        cancelRenameBtn.addEventListener('click', () => {
            renameModal.classList.remove('active');
            currentRenameTabId = null;
        });

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (renameModal.classList.contains('active')) {
                    renameModal.classList.remove('active');
                    currentRenameTabId = null;
                }
                if (goalModal.classList.contains('active')) {
                    goalModal.classList.remove('active');
                }
                if (messageModal.classList.contains('active')) {
                    messageModal.classList.remove('active');
                    currentMessageSelection = null;
                }
                if (dropdownMenu.classList.contains('active')) {
                    closeDropdown();
                }
                if (formatMenu.classList.contains('active')) {
                    closeFormatMenu();
                }
            }
        });

        // Rename on enter
        renameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmRenameBtn.click();
            }
        });

        // Goal settings modal functions
        goalSettingsBtn.addEventListener('click', () => {
            const activeTab = tabManager.getActiveTab();
            if (activeTab) {
                charGoalInput.value = activeTab.charGoal || '';
                wordGoalInput.value = activeTab.wordGoal || '';
                goalModal.classList.add('active');
                setTimeout(() => charGoalInput.focus(), 100);
            }
        });

        confirmGoalBtn.addEventListener('click', () => {
            const charGoal = parseInt(charGoalInput.value) || 0;
            const wordGoal = parseInt(wordGoalInput.value) || 0;
            tabManager.setGoals(tabManager.activeTabId, charGoal, wordGoal);
            goalModal.classList.remove('active');
        });

        cancelGoalBtn.addEventListener('click', () => {
            goalModal.classList.remove('active');
        });

        // Save goals on enter
        charGoalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmGoalBtn.click();
            }
        });

        wordGoalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmGoalBtn.click();
            }
        });

        // Update counters
        function updateCounters(manager = null) {
            const text = notepad.value;
            const tm = manager || (typeof tabManager !== 'undefined' ? tabManager : null);
            const activeTab = tm ? tm.getActiveTab() : null;
            const charProgressBar = document.getElementById('charProgressBar');
            const charProgress = document.getElementById('charProgress');
            const wordProgressBar = document.getElementById('wordProgressBar');
            const wordProgress = document.getElementById('wordProgress');

            // Character count
            const chars = text.length;
            let charGoalMet = false;

            if (activeTab && activeTab.charGoal) {
                const percentage = Math.min((chars / activeTab.charGoal) * 100, 100);
                charCount.textContent = `${chars.toLocaleString()} / ${activeTab.charGoal.toLocaleString()}`;

                // Show and update progress bar
                charProgress.classList.remove('hidden');
                charProgressBar.style.width = `${percentage}%`;

                // Color based on progress
                if (percentage >= 100) {
                    charCount.className = 'text-sm text-white font-bold tabular-nums';
                    charProgressBar.className = 'h-full bg-white transition-all duration-300';
                    charGoalMet = true;
                } else if (percentage >= 75) {
                    charCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                    charProgressBar.className = 'h-full bg-gray-300 transition-all duration-300';
                } else if (percentage >= 50) {
                    charCount.className = 'text-sm text-gray-300 font-semibold tabular-nums';
                    charProgressBar.className = 'h-full bg-gray-500 transition-all duration-300';
                } else {
                    charCount.className = 'text-sm text-gray-400 font-semibold tabular-nums';
                    charProgressBar.className = 'h-full bg-gray-700 transition-all duration-300';
                }
            } else {
                charCount.textContent = chars.toLocaleString();
                charCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                charProgress.classList.add('hidden');
            }

            // Word count
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            const wordCountValue = words.length;
            let wordGoalMet = false;

            if (activeTab && activeTab.wordGoal) {
                const percentage = Math.min((wordCountValue / activeTab.wordGoal) * 100, 100);
                wordCount.textContent = `${wordCountValue.toLocaleString()} / ${activeTab.wordGoal.toLocaleString()}`;

                // Show and update progress bar
                wordProgress.classList.remove('hidden');
                wordProgressBar.style.width = `${percentage}%`;

                // Color based on progress
                if (percentage >= 100) {
                    wordCount.className = 'text-sm text-white font-bold tabular-nums';
                    wordProgressBar.className = 'h-full bg-white transition-all duration-300';
                    wordGoalMet = true;
                } else if (percentage >= 75) {
                    wordCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                    wordProgressBar.className = 'h-full bg-gray-300 transition-all duration-300';
                } else if (percentage >= 50) {
                    wordCount.className = 'text-sm text-gray-300 font-semibold tabular-nums';
                    wordProgressBar.className = 'h-full bg-gray-500 transition-all duration-300';
                } else {
                    wordCount.className = 'text-sm text-gray-400 font-semibold tabular-nums';
                    wordProgressBar.className = 'h-full bg-gray-700 transition-all duration-300';
                }
            } else {
                wordCount.textContent = wordCountValue.toLocaleString();
                wordCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                wordProgress.classList.add('hidden');
            }

            // Confetti Trigger
            if ((charGoalMet || wordGoalMet) && !confettiTriggered) {
                confetti({
                    particleCount: 100,
                    spread: 70,
                    origin: { y: 0.6 },
                    colors: ['#ffffff', '#a8a29e', '#52525b'] // Monochrome confetti
                });
                confettiTriggered = true;
            } else if (!charGoalMet && !wordGoalMet) {
                // Reset confetti if below goals (so it can trigger again if you delete and type again?)
                // Or maybe only reset if BOTH are false, effectively meaning you dropped below both goals.
                confettiTriggered = false;
            }
        }

        // Update markdown preview
        function updateMarkdownPreview() {
            if (typeof marked !== 'undefined') {
                markdownPreview.innerHTML = marked.parse(notepad.value || '*No content to preview*');
            }
        }

        // Show saving indicator
        function showSavingIndicator() {
            const indicator = document.querySelector('.flex.items-center.gap-2.text-xs.text-gray-500');
            indicator.classList.remove('text-gray-500');
            indicator.classList.add('text-white');

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                indicator.classList.remove('text-white');
                indicator.classList.add('text-gray-500');
            }, 1000);
        }

        // Toggle markdown preview
        markdownToggle.addEventListener('click', () => {
            isPreviewMode = !isPreviewMode;
            if (isPreviewMode) {
                updateMarkdownPreview();
                notepad.classList.add('hidden');
                markdownPreview.classList.remove('hidden');
            } else {
                notepad.classList.remove('hidden');
                markdownPreview.classList.add('hidden');
            }
        });

        // Update counters on input
        notepad.addEventListener('input', () => {
            updateCounters();
            tabManager.saveCurrentTabContent();
            showSavingIndicator();
            if (isPreviewMode) {
                updateMarkdownPreview();
            }
        });

        // Handle tab key and auto-list
        notepad.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = notepad.selectionStart;
                const end = notepad.selectionEnd;

                // Insert tab character
                notepad.value = notepad.value.substring(0, start) + '\t' + notepad.value.substring(end);

                // Move cursor after tab
                notepad.selectionStart = notepad.selectionEnd = start + 1;

                // Trigger input event to save and update counters
                notepad.dispatchEvent(new Event('input'));
            } else if (e.key === 'Enter') {
                const start = notepad.selectionStart;
                const end = notepad.selectionEnd;
                const value = notepad.value;

                // Get the current line
                const lineStart = value.lastIndexOf('\n', start - 1) + 1;
                const lineEnd = value.indexOf('\n', start);
                const currentLine = value.substring(lineStart, lineEnd === -1 ? value.length : lineEnd);

                // Regex for bullet points (*, -, +) or numbers (1., 2.)
                // Captures: 1=indent, 2=marker
                const match = currentLine.match(/^(\s*)([*+-]|\d+\.)\s/);

                if (match) {
                    const indent = match[1];
                    const marker = match[2];

                    // If the line is empty (just the marker), remove the marker
                    if (currentLine.trim() === marker) {
                        e.preventDefault();
                        // Remove the marker and indent
                        notepad.value = value.substring(0, lineStart) + value.substring(lineEnd === -1 ? value.length : lineEnd);
                        notepad.selectionStart = notepad.selectionEnd = lineStart;
                        notepad.dispatchEvent(new Event('input'));
                        return;
                    }

                    e.preventDefault();

                    let nextMarker = marker;
                    // Auto-increment number
                    if (/^\d+\.$/.test(marker)) {
                        const num = parseInt(marker);
                        nextMarker = (num + 1) + '.';
                    }

                    const insertion = `\n${indent}${nextMarker} `;
                    notepad.value = value.substring(0, start) + insertion + value.substring(end);
                    notepad.selectionStart = notepad.selectionEnd = start + insertion.length;

                    // Trigger input event
                    notepad.dispatchEvent(new Event('input'));
                }
            } else if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'b') {
                e.preventDefault();
                toggleBold();
            }
        });

        // Formatting Functions
        function insertFormatting(startTag, endTag) {
            const start = notepad.selectionStart;
            const end = notepad.selectionEnd;
            const value = notepad.value;
            const selectedText = value.substring(start, end);

            notepad.value = value.substring(0, start) + startTag + selectedText + endTag + value.substring(end);

            notepad.selectionStart = start + startTag.length;
            notepad.selectionEnd = end + startTag.length;

            notepad.focus();
            notepad.dispatchEvent(new Event('input'));
        }

        function toggleBold() {
            insertFormatting('**', '**');
        }

        function toggleHighlight() {
             insertFormatting('<mark>', '</mark>');
        }

        function openMessageModal() {
            if (notepad.selectionStart === notepad.selectionEnd) {
                alert("Please select text to add a message to.");
                return;
            }
            currentMessageSelection = {
                start: notepad.selectionStart,
                end: notepad.selectionEnd
            };
            messageInput.value = '';
            messageModal.classList.add('active');
            setTimeout(() => messageInput.focus(), 100);

            // Close format menu if open
            if (formatMenu.classList.contains('active')) {
                formatMenu.classList.remove('active');
                tabDropdownBackdrop.classList.remove('active');
            }
        }

        // Message Modal Listeners
        confirmMessageBtn.addEventListener('click', () => {
             const msg = messageInput.value.trim();
             if (msg && currentMessageSelection) {
                 const value = notepad.value;
                 const selectedText = value.substring(currentMessageSelection.start, currentMessageSelection.end);
                 const escapedMsg = msg.replace(/"/g, '&quot;');
                 const replacement = `<span class="note-tooltip" data-msg="${escapedMsg}">${selectedText}</span>`;

                 notepad.value = value.substring(0, currentMessageSelection.start) + replacement + value.substring(currentMessageSelection.end);
                 notepad.selectionStart = currentMessageSelection.start + replacement.length;
                 notepad.selectionEnd = notepad.selectionStart;
                 notepad.dispatchEvent(new Event('input'));
             }
             messageModal.classList.remove('active');
             currentMessageSelection = null;
        });

        cancelMessageBtn.addEventListener('click', () => {
            messageModal.classList.remove('active');
            currentMessageSelection = null;
        });

        messageInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') confirmMessageBtn.click();
        });

        // Formatting Menu Logic
        formatMenuToggle.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = formatMenu.classList.contains('active');
            if (isActive) {
                closeFormatMenu();
            } else {
                openFormatMenu();
            }
        });

        function openFormatMenu() {
            // Position
            const rect = formatMenuToggle.getBoundingClientRect();
            formatMenu.style.top = `${rect.bottom + 8}px`;
            formatMenu.style.left = `${rect.left}px`; // Align left or adjust if too close to edge

            // Check if it goes off screen
            if (rect.left + 200 > window.innerWidth) {
                 formatMenu.style.left = `${rect.right - 200}px`;
            }

            tabDropdownBackdrop.classList.add('active');
            formatMenu.classList.add('active');
        }

        function closeFormatMenu() {
            tabDropdownBackdrop.classList.remove('active');
            formatMenu.classList.remove('active');
        }

        // Attach button listeners
        btnFormatBold.addEventListener('click', () => {
            toggleBold();
            closeFormatMenu();
        });

        btnFormatHighlight.addEventListener('click', () => {
            toggleHighlight();
            closeFormatMenu();
        });

        btnFormatMessage.addEventListener('click', () => {
            openMessageModal();
            // closeFormatMenu is called inside openMessageModal
        });

        // Add smooth focus effect
        notepad.addEventListener('focus', () => {
            notepad.parentElement.parentElement.classList.add('ring-1', 'ring-gray-700');
        });

        notepad.addEventListener('blur', () => {
            notepad.parentElement.parentElement.classList.remove('ring-1', 'ring-gray-700');
        });

        // Save content before closing/refreshing
        window.addEventListener('beforeunload', () => {
            tabManager.saveCurrentTabContent();
        });

        // Focus Mode Toggle
        focusToggle.addEventListener('click', () => {
            isFocusMode = !isFocusMode;
            document.body.classList.toggle('focus-mode');

            if (isFocusMode) {
                // Activate Focus Mode
                focusToggle.classList.add('text-white');
            } else {
                // Deactivate Focus Mode
                focusToggle.classList.remove('text-white');
            }
        });

        // Timer Logic
        const timerDisplay = document.getElementById('timerDisplay');
        const timerToggleBtn = document.getElementById('timerToggleBtn');
        const timerResetBtn = document.getElementById('timerResetBtn');
        const timerIcon = document.getElementById('timerIcon');

        let timerInterval;
        let isTimerRunning = false;

        // Timer State
        let accumulatedTime = 0; // seconds
        let startTime = null; // timestamp

        function loadTimerState() {
            const savedAccumulated = localStorage.getItem('timerAccumulatedTime');
            const savedStartTime = localStorage.getItem('timerStartTime');

            accumulatedTime = savedAccumulated ? parseFloat(savedAccumulated) : 0;
            startTime = savedStartTime ? parseInt(savedStartTime) : null;

            if (startTime) {
                // Timer was running
                isTimerRunning = true;
                startTimerInterval();
                updateTimerUI();
                updateToggleBtnState(true);
            } else {
                isTimerRunning = false;
                updateTimerUI();
                updateToggleBtnState(false);
            }
        }

        function saveTimerState() {
            localStorage.setItem('timerAccumulatedTime', accumulatedTime);
            if (startTime) {
                localStorage.setItem('timerStartTime', startTime);
            } else {
                localStorage.removeItem('timerStartTime');
            }
        }

        function getElapsedSeconds() {
            if (isTimerRunning && startTime) {
                const currentSessionSeconds = (Date.now() - startTime) / 1000;
                return Math.floor(accumulatedTime + currentSessionSeconds);
            }
            return Math.floor(accumulatedTime);
        }

        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = Math.floor(totalSeconds % 60);

            const pad = (num) => num.toString().padStart(2, '0');

            if (hours > 0) {
                return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }
            return `${pad(minutes)}:${pad(seconds)}`;
        }

        function updateTimerUI() {
            if (timerDisplay) {
                timerDisplay.textContent = formatTime(getElapsedSeconds());
            }
        }

        function updateToggleBtnState(running) {
            if (running) {
                // Show Pause Icon
                if (timerIcon) {
                    timerIcon.innerHTML = '<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>';
                }
                if (timerToggleBtn) {
                    timerToggleBtn.classList.remove('text-neutral-400', 'hover:text-white');
                    timerToggleBtn.classList.add('text-red-400', 'hover:text-red-300');
                }
            } else {
                // Show Play Icon
                if (timerIcon) {
                    timerIcon.innerHTML = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>';
                }
                if (timerToggleBtn) {
                    timerToggleBtn.classList.remove('text-red-400', 'hover:text-red-300');
                    timerToggleBtn.classList.add('text-neutral-400', 'hover:text-white');
                }
            }
        }

        function startTimerInterval() {
            clearInterval(timerInterval);
            timerInterval = setInterval(() => {
                updateTimerUI();
            }, 1000);
        }

        function toggleTimer() {
            if (isTimerRunning) {
                // Pause
                if (startTime) {
                    accumulatedTime += (Date.now() - startTime) / 1000;
                    startTime = null;
                }
                isTimerRunning = false;
                clearInterval(timerInterval);
                updateToggleBtnState(false);
                updateTimerUI(); // Final update to freeze correct time
            } else {
                // Start
                startTime = Date.now();
                isTimerRunning = true;
                startTimerInterval();
                updateToggleBtnState(true);
            }
            saveTimerState();
        }

        function resetTimer() {
            isTimerRunning = false;
            clearInterval(timerInterval);
            accumulatedTime = 0;
            startTime = null;
            saveTimerState();
            updateTimerUI();
            updateToggleBtnState(false);
        }

        if (timerToggleBtn) {
            timerToggleBtn.addEventListener('click', toggleTimer);
        }

        if (timerResetBtn) {
            timerResetBtn.addEventListener('click', resetTimer);
        }

        // Load initial state
        loadTimerState();

        // Save state on unload just in case, though we save on toggle
        window.addEventListener('beforeunload', () => {
             // Only if running, we might want to checkpoint accumulatedTime?
             // Actually, if we use startTime logic, we don't strictly need to update accumulatedTime on unload
             // because on load we calculate (Now - startTime).
             // But let's be safe.
        });

        // Scrollable Top Bar Logic
        const scrollContainer = document.getElementById('counterBarScroll');
        const scrollLeftBtn = document.getElementById('scrollLeftBtn');
        const scrollRightBtn = document.getElementById('scrollRightBtn');

        function updateScrollButtons() {
            if (!scrollContainer) return;

            // Tolerance to handle sub-pixel rendering differences
            const tolerance = 1;
            const isOverflowing = scrollContainer.scrollWidth > scrollContainer.clientWidth + tolerance;
            const canScrollLeft = scrollContainer.scrollLeft > 0;
            const canScrollRight = scrollContainer.scrollLeft < scrollContainer.scrollWidth - scrollContainer.clientWidth - tolerance;

            if (isOverflowing) {
                if (canScrollLeft) {
                    scrollLeftBtn.classList.remove('hidden');
                    scrollLeftBtn.classList.add('flex');
                } else {
                    scrollLeftBtn.classList.add('hidden');
                    scrollLeftBtn.classList.remove('flex');
                }

                if (canScrollRight) {
                    scrollRightBtn.classList.remove('hidden');
                    scrollRightBtn.classList.add('flex');
                } else {
                    scrollRightBtn.classList.add('hidden');
                    scrollRightBtn.classList.remove('flex');
                }
            } else {
                scrollLeftBtn.classList.add('hidden');
                scrollLeftBtn.classList.remove('flex');
                scrollRightBtn.classList.add('hidden');
                scrollRightBtn.classList.remove('flex');
            }
        }

        if (scrollContainer) {
            scrollContainer.addEventListener('scroll', updateScrollButtons);
            window.addEventListener('resize', updateScrollButtons);

            // Initial check
            updateScrollButtons();

            // Also check after a short delay in case font loading changes widths
            setTimeout(updateScrollButtons, 500);

            scrollLeftBtn.addEventListener('click', () => {
                scrollContainer.scrollBy({ left: -200, behavior: 'smooth' });
            });

            scrollRightBtn.addEventListener('click', () => {
                scrollContainer.scrollBy({ left: 200, behavior: 'smooth' });
            });
        }
    </script>
</body>
</html>
