<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        textarea::-webkit-scrollbar,
        #markdownPreview::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track,
        #markdownPreview::-webkit-scrollbar-track {
            background: #1f2937;
        }

        textarea::-webkit-scrollbar-thumb,
        #markdownPreview::-webkit-scrollbar-thumb {
            background: #525252;
        }

        textarea::-webkit-scrollbar-thumb:hover,
        #markdownPreview::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        #markdownPreview {
            overflow-y: auto;
        }

        #markdownPreview h1 {
            font-size: 2em;
            font-weight: bold;
            margin: 0.67em 0;
        }

        #markdownPreview h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin: 0.75em 0;
        }

        #markdownPreview h3 {
            font-size: 1.17em;
            font-weight: bold;
            margin: 0.83em 0;
        }

        #markdownPreview p {
            margin: 1em 0;
        }

        #markdownPreview ul, #markdownPreview ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        #markdownPreview li {
            margin: 0.5em 0;
        }

        #markdownPreview code {
            background-color: #262626;
            padding: 0.2em 0.4em;
            font-family: monospace;
        }

        #markdownPreview pre {
            background-color: #171717;
            padding: 1em;
            overflow-x: auto;
            margin: 1em 0;
        }

        #markdownPreview pre code {
            background-color: transparent;
            padding: 0;
        }

        #markdownPreview blockquote {
            border-left: 4px solid #4b5563;
            padding-left: 1em;
            margin: 1em 0;
            color: #9ca3af;
        }

        #markdownPreview a {
            color: #e5e7eb;
            text-decoration: underline;
        }

        #markdownPreview hr {
            border: none;
            border-top: 1px solid #4b5563;
            margin: 2em 0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.8);
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .modal-content {
            transform: translateY(20px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .modal.active .modal-content {
            transform: translateY(0);
            opacity: 1;
        }

        /* Tab Modal */
        .tab-modal-backdrop {
            position: fixed;
            inset: 0;
            background-color: rgba(0, 0, 0, 0.8);
            z-index: 9998;
            display: none;
            opacity: 0;
            transition: opacity 0.4s ease-in-out;
        }

        .tab-modal-backdrop.active {
            display: flex;
            align-items: center;
            justify-content: center;
            opacity: 1;
        }

        .dropdown-menu {
            background-color: #171717;
            border: 1px solid #404040;
            box-shadow: 0 25px 50px -12px rgba(0, 0, 0, 0.5);
            width: 90%;
            max-width: 480px;
            max-height: 70vh;
            overflow-y: auto;
            z-index: 9999;
            transform: scale(0.95) translateY(10px);
            opacity: 0;
            transition: all 0.4s cubic-bezier(0.16, 1, 0.3, 1);
        }

        .tab-modal-backdrop.active .dropdown-menu {
            transform: scale(1) translateY(0);
            opacity: 1;
        }

        .dropdown-menu::-webkit-scrollbar {
            width: 8px;
        }

        .dropdown-menu::-webkit-scrollbar-track {
            background: #171717;
        }

        .dropdown-menu::-webkit-scrollbar-thumb {
            background: #525252;
        }

        .dropdown-menu::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        .dropdown-item {
            display: flex;
            align-items: center;
            justify-content: space-between;
            padding: 1rem 1.5rem;
            color: #e5e5e5;
            cursor: pointer;
            transition: background-color 0.2s ease-in-out;
            border-bottom: 1px solid #404040;
        }

        .dropdown-item:last-child {
            border-bottom: none;
        }

        .dropdown-item:hover {
            background-color: #4b5563;
        }

        .dropdown-item.active {
            background-color: #1f2937;
        }

        .dropdown-item.new-tab {
            color: #e5e7eb;
            font-weight: 600;
            border-top: 2px solid #4b5563;
            background-color: #1f2937;
        }

        .dropdown-item.new-tab:hover {
            background-color: #374151;
        }

        .tab-actions {
            display: flex;
            gap: 0.25rem;
            opacity: 0;
            transition: opacity 0.2s ease;
        }

        .dropdown-item:hover .tab-actions {
            opacity: 1;
        }

        .action-btn {
            padding: 0.5rem;
            transition: all 0.2s ease-in-out;
        }

        .action-btn:hover {
            background-color: #6b7280;
        }

        .action-btn.delete:hover {
            background-color: #dc2626;
        }

        @keyframes slideIn {
            from {
                opacity: 0;
                transform: translateY(-5px);
            }
            to {
                opacity: 1;
                transform: translateY(0);
            }
        }

        .dropdown-item {
            animation: slideIn 0.2s ease forwards;
        }

        .dropdown-item:nth-child(1) { animation-delay: 0.02s; }
        .dropdown-item:nth-child(2) { animation-delay: 0.04s; }
        .dropdown-item:nth-child(3) { animation-delay: 0.06s; }
        .dropdown-item:nth-child(4) { animation-delay: 0.08s; }
        .dropdown-item:nth-child(5) { animation-delay: 0.10s; }

        /* Floating Tab Button */
        .floating-tab-button {
            position: fixed;
            bottom: 2rem;
            right: 2rem;
            z-index: 1000;
            background-color: #ffffff;
            color: #000000;
            padding: 1rem;
            box-shadow: 0 10px 15px -3px rgba(0, 0, 0, 0.5), 0 4px 6px -2px rgba(0, 0, 0, 0.3);
            cursor: pointer;
            transition: all 0.3s cubic-bezier(0.34, 1.56, 0.64, 1);
            display: flex;
            align-items: center;
            justify-content: center;
            border: none;
        }

        .floating-tab-button:hover {
            transform: scale(1.1) translateY(-2px);
            box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.5), 0 10px 10px -5px rgba(0, 0, 0, 0.3);
        }

        .floating-tab-button:active {
            transform: scale(0.95);
        }

        .tab-badge {
            position: absolute;
            top: -4px;
            right: -4px;
            background-color: #111827;
            color: white;
            font-size: 0.75rem;
            font-weight: bold;
            padding: 0.125rem 0.375rem;
            min-width: 1.25rem;
            text-align: center;
            border: 1px solid #374151;
        }

        /* Focus Mode Overrides */
        body.focus-mode {
            padding: 0 !important;
        }

        body.focus-mode #appContainer {
            max-width: 100vw !important;
            height: 100vh !important;
            width: 100vw !important;
            border: none !important;
            box-shadow: none !important;
        }

        body.focus-mode #counterBar,
        body.focus-mode #floatingTabButton {
            opacity: 0.2;
            transition: opacity 0.3s ease;
        }

        body.focus-mode #counterBar:hover,
        body.focus-mode #floatingTabButton:hover {
            opacity: 1;
        }
    </style>
</head>
<body class="bg-black min-h-screen flex items-center justify-center p-4 md:p-8 selection:bg-white/20">
    <div id="appContainer" class="w-full max-w-4xl h-[90vh] flex flex-col bg-neutral-900/40 backdrop-blur-xl shadow-2xl overflow-hidden border border-white/10 transition-all duration-500 ease-in-out">

        <!-- Counter Bar -->
        <div id="counterBar" class="flex items-center justify-between px-6 py-4 border-b border-white/5 bg-transparent backdrop-blur-sm transition-all duration-300 ease-in-out">
            <div class="flex items-center gap-8">
                <!-- Character Counter -->
                <div class="flex items-center gap-3">
                    <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-neutral-500 font-medium">Characters</span>
                            <span class="text-sm text-neutral-200 font-semibold tabular-nums tracking-wide" id="charCount">0</span>
                        </div>
                        <div id="charProgress" class="hidden h-1 w-32 bg-neutral-800 rounded-full overflow-hidden">
                            <div id="charProgressBar" class="h-full bg-white transition-all duration-500 ease-out" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Word Counter -->
                <div class="flex items-center gap-3">
                    <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-neutral-500 font-medium">Words</span>
                            <span class="text-sm text-neutral-200 font-semibold tabular-nums tracking-wide" id="wordCount">0</span>
                        </div>
                        <div id="wordProgress" class="hidden h-1 w-32 bg-neutral-800 rounded-full overflow-hidden">
                            <div id="wordProgressBar" class="h-full bg-white transition-all duration-500 ease-out" style="width: 0%"></div>
                        </div>
                    </div>
                </div>

                <!-- Timer -->
                <div class="flex items-center gap-3">
                    <svg class="w-4 h-4 text-neutral-500" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 8v4l3 3m6-3a9 9 0 11-18 0 9 9 0 0118 0z"></path>
                    </svg>
                    <div class="flex flex-col gap-1">
                        <div class="flex items-center gap-2">
                            <span class="text-sm text-neutral-500 font-medium">Time</span>
                            <span class="text-sm text-neutral-200 font-semibold tabular-nums tracking-wide" id="timerDisplay">00:00</span>
                        </div>
                    </div>
                    <button id="timerToggleBtn" class="flex items-center justify-center w-6 h-6 rounded-full hover:bg-white/10 text-neutral-400 hover:text-white transition-colors" title="Start/Stop Timer">
                        <svg class="w-4 h-4" fill="currentColor" viewBox="0 0 20 20" id="timerIcon">
                            <path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>
                        </svg>
                    </button>
                </div>

                <!-- Goal Settings Button -->
                <button id="goalSettingsBtn" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-2 py-1.5 rounded hover:bg-white/5" title="Set goals">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 19v-6a2 2 0 00-2-2H5a2 2 0 00-2 2v6a2 2 0 002 2h2a2 2 0 002-2zm0 0V9a2 2 0 012-2h2a2 2 0 012 2v10m-6 0a2 2 0 002 2h2a2 2 0 002-2m0 0V5a2 2 0 012-2h2a2 2 0 012 2v14a2 2 0 01-2 2h-2a2 2 0 01-2-2z"></path>
                    </svg>
                </button>
            </div>

            <div class="flex items-center gap-4">
                <!-- Focus Toggle -->
                <button id="focusToggle" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-3 py-1.5 rounded hover:bg-white/5" title="Toggle focus mode">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 8V4m0 0h4M4 4l5 5m11-1V4m0 0h-4m4 0l-5 5M4 16v4m0 0h4m-4 0l5-5m11 5l-5-5m5 5v-4m0 4h-4"></path>
                    </svg>
                    <span class="font-medium">Focus</span>
                </button>

                <!-- Markdown Toggle -->
                <button id="markdownToggle" class="flex items-center gap-2 text-xs text-neutral-500 hover:text-white transition-all duration-200 hover:scale-105 active:scale-95 px-3 py-1.5 rounded hover:bg-white/5">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <span class="font-medium">Preview</span>
                </button>

                <!-- Auto-save indicator -->
                <div class="flex items-center gap-2 text-xs text-gray-500">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="font-medium">Auto-saved</span>
                </div>
            </div>
        </div>

        <!-- Editor/Preview Container -->
        <div class="flex-1 relative overflow-hidden">
            <!-- Textarea -->
            <textarea
                id="notepad"
                placeholder="Start typing..."
                autofocus
                class="absolute inset-0 w-full h-full bg-transparent text-gray-100 placeholder-neutral-600 px-8 py-6 text-base md:text-lg leading-relaxed resize-none outline-none focus:ring-0 font-mono"
            ></textarea>

            <!-- Markdown Preview -->
            <div id="markdownPreview" class="absolute inset-0 w-full h-full bg-transparent text-gray-100 px-8 py-6 text-base md:text-lg leading-relaxed hidden">
            </div>
        </div>
    </div>

    <!-- Tab Modal (at body level) -->
    <div class="tab-modal-backdrop" id="tabModalBackdrop">
        <div class="dropdown-menu" id="dropdownMenu">
            <!-- Tabs will be inserted here -->
        </div>
    </div>

    <!-- Floating Tab Button -->
    <button class="floating-tab-button" id="floatingTabButton" title="Manage tabs">
        <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
        </svg>
        <span class="tab-badge" id="tabBadge">1</span>
    </button>

    <!-- Rename Modal -->
    <div id="renameModal" class="modal">
        <div class="modal-content bg-gray-800 rounded-lg p-6 w-full max-w-md border border-gray-700">
            <h3 class="text-xl font-semibold text-gray-100 mb-4">Rename Tab</h3>
            <input
                type="text"
                id="renameInput"
                class="w-full bg-neutral-950 text-gray-100 px-4 py-2 rounded border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-700 mb-4"
                placeholder="Enter tab name..."
            />
            <div class="flex justify-end gap-3">
                <button id="cancelRenameBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded transition-colors">
                    Cancel
                </button>
                <button id="confirmRenameBtn" class="px-4 py-2 bg-gray-200 hover:bg-white text-gray-950 font-medium rounded transition-colors">
                    Rename
                </button>
            </div>
        </div>
    </div>

    <!-- Goal Settings Modal -->
    <div id="goalModal" class="modal">
        <div class="modal-content bg-gray-800 rounded-lg p-6 w-full max-w-md border border-gray-700">
            <h3 class="text-xl font-semibold text-gray-100 mb-4">Set Goals for This Note</h3>
            <p class="text-sm text-gray-400 mb-4">Set optional word and character count goals. Leave blank or set to 0 to remove a goal.</p>

            <div class="space-y-4 mb-6">
                <div>
                    <label class="block text-sm text-gray-300 mb-2">Character Goal</label>
                    <input
                        type="number"
                        id="charGoalInput"
                        min="0"
                        class="w-full bg-neutral-950 text-gray-100 px-4 py-2 rounded border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-700"
                        placeholder="e.g., 1000"
                    />
                </div>

                <div>
                    <label class="block text-sm text-gray-300 mb-2">Word Goal</label>
                    <input
                        type="number"
                        id="wordGoalInput"
                        min="0"
                        class="w-full bg-neutral-950 text-gray-100 px-4 py-2 rounded border border-neutral-800 focus:outline-none focus:ring-2 focus:ring-neutral-700"
                        placeholder="e.g., 200"
                    />
                </div>
            </div>

            <div class="flex justify-end gap-3">
                <button id="cancelGoalBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded transition-colors">
                    Cancel
                </button>
                <button id="confirmGoalBtn" class="px-4 py-2 bg-gray-200 hover:bg-white text-gray-950 font-medium rounded transition-colors">
                    Save Goals
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tab Management
        class TabManager {
            constructor() {
                this.tabs = [];
                this.activeTabId = null;
                this.loadTabs();
                this.init();
            }

            init() {
                if (this.tabs.length === 0) {
                    this.createTab();
                } else {
                    this.activeTabId = this.tabs[0].id;
                    this.renderDropdown();
                    this.loadActiveTab();
                }
            }

            loadTabs() {
                const savedTabs = localStorage.getItem('notepadTabs');
                if (savedTabs) {
                    this.tabs = JSON.parse(savedTabs);
                }
                const savedActiveTab = localStorage.getItem('activeTabId');
                if (savedActiveTab) {
                    this.activeTabId = savedActiveTab;
                }
            }

            saveTabs() {
                localStorage.setItem('notepadTabs', JSON.stringify(this.tabs));
                localStorage.setItem('activeTabId', this.activeTabId);
            }

            createTab() {
                const newTab = {
                    id: Date.now().toString(),
                    title: `Note ${this.tabs.length + 1}`,
                    content: '',
                    charGoal: null,
                    wordGoal: null
                };
                this.tabs.push(newTab);
                this.activeTabId = newTab.id;
                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
                updateCounters(this);
            }

            setGoals(tabId, charGoal, wordGoal) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (tab) {
                    tab.charGoal = charGoal > 0 ? charGoal : null;
                    tab.wordGoal = wordGoal > 0 ? wordGoal : null;
                    this.saveTabs();
                    updateCounters(this);
                }
            }

            switchTab(tabId) {
                // Save current tab content before switching
                this.saveCurrentTabContent();
                this.activeTabId = tabId;
                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
            }

            renameTab(tabId, newTitle) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (tab && newTitle.trim()) {
                    tab.title = newTitle.trim();
                    this.saveTabs();
                    this.renderDropdown();
                }
            }

            deleteTab(tabId) {
                if (this.tabs.length === 1) {
                    alert('Cannot delete the last tab');
                    return;
                }

                const tabIndex = this.tabs.findIndex(t => t.id === tabId);
                this.tabs.splice(tabIndex, 1);

                // Switch to another tab
                if (this.activeTabId === tabId) {
                    const newActiveIndex = Math.min(tabIndex, this.tabs.length - 1);
                    this.activeTabId = this.tabs[newActiveIndex].id;
                }

                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
            }

            saveCurrentTabContent() {
                const activeTab = this.tabs.find(t => t.id === this.activeTabId);
                if (activeTab) {
                    activeTab.content = notepad.value;
                    this.saveTabs();
                }
            }

            loadActiveTab() {
                const activeTab = this.tabs.find(t => t.id === this.activeTabId);
                if (activeTab) {
                    notepad.value = activeTab.content;
                    updateCounters(this);
                    updateMarkdownPreview();
                }
            }

            renderDropdown() {
                const dropdownMenu = document.getElementById('dropdownMenu');

                // Modal header
                const modalHeader = `
                    <div style="padding: 1.5rem; border-bottom: 1px solid #404040; display: flex; align-items: center; justify-content: space-between; background-color: #171717;">
                        <h3 style="font-size: 1.25rem; font-weight: 600; color: #e5e5e5; margin: 0;">Manage Tabs</h3>
                        <button id="closeTabModal" style="padding: 0.5rem; color: #a3a3a3; hover:color: #e5e5e5; background: none; border: none; cursor: pointer; transition: all 0.2s; display: flex; align-items: center; justify-content: center;">
                            <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M6 18L18 6M6 6l12 12"></path>
                            </svg>
                        </button>
                    </div>
                `;

                // Render tab items
                const tabItems = this.tabs.map(tab => `
                    <div class="dropdown-item ${tab.id === this.activeTabId ? 'active' : ''}" data-tab-id="${tab.id}">
                        <span class="flex-1 truncate">${tab.title}</span>
                        <div class="tab-actions">
                            <button class="action-btn rename" data-tab-id="${tab.id}" title="Rename">
                                <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                                </svg>
                            </button>
                            <button class="action-btn delete" data-tab-id="${tab.id}" title="Delete">
                                <svg class="w-4 h-4 text-gray-300" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                                </svg>
                            </button>
                        </div>
                    </div>
                `).join('');

                // Add new tab button
                const newTabButton = `
                    <div class="dropdown-item new-tab" id="newTabBtn">
                        <svg class="w-5 h-5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                        </svg>
                        <span>New Tab</span>
                    </div>
                `;

                dropdownMenu.innerHTML = modalHeader + tabItems + newTabButton;

                // Update tab badge count
                const tabBadge = document.getElementById('tabBadge');
                if (tabBadge) {
                    tabBadge.textContent = this.tabs.length;
                }

                // Attach event listeners
                this.attachDropdownListeners();
            }

            attachDropdownListeners() {
                // Close button in modal header
                const closeBtn = document.getElementById('closeTabModal');
                if (closeBtn) {
                    closeBtn.addEventListener('click', () => {
                        closeDropdown();
                    });
                }

                // Tab click to switch
                document.querySelectorAll('.dropdown-item:not(.new-tab)').forEach(item => {
                    item.addEventListener('click', (e) => {
                        if (!e.target.closest('.action-btn')) {
                            const tabId = item.getAttribute('data-tab-id');
                            this.switchTab(tabId);
                            closeDropdown();
                        }
                    });
                });

                // Rename buttons
                document.querySelectorAll('.action-btn.rename').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const tabId = btn.getAttribute('data-tab-id');
                        openRenameModal(tabId);
                        closeDropdown();
                    });
                });

                // Delete buttons
                document.querySelectorAll('.action-btn.delete').forEach(btn => {
                    btn.addEventListener('click', (e) => {
                        e.stopPropagation();
                        const tabId = btn.getAttribute('data-tab-id');
                        if (confirm('Are you sure you want to delete this tab?')) {
                            this.deleteTab(tabId);
                        }
                    });
                });

                // New tab button
                const newTabBtn = document.getElementById('newTabBtn');
                if (newTabBtn) {
                    newTabBtn.addEventListener('click', () => {
                        this.createTab();
                        closeDropdown();
                    });
                }
            }

            getActiveTab() {
                return this.tabs.find(t => t.id === this.activeTabId);
            }
        }

        // Initialize
        const notepad = document.getElementById('notepad');
        const markdownPreview = document.getElementById('markdownPreview');
        const markdownToggle = document.getElementById('markdownToggle');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const floatingTabButton = document.getElementById('floatingTabButton');
        const tabModalBackdrop = document.getElementById('tabModalBackdrop');
        const dropdownMenu = document.getElementById('dropdownMenu');
        const renameModal = document.getElementById('renameModal');
        const renameInput = document.getElementById('renameInput');
        const confirmRenameBtn = document.getElementById('confirmRenameBtn');
        const cancelRenameBtn = document.getElementById('cancelRenameBtn');
        const goalModal = document.getElementById('goalModal');
        const goalSettingsBtn = document.getElementById('goalSettingsBtn');
        const charGoalInput = document.getElementById('charGoalInput');
        const wordGoalInput = document.getElementById('wordGoalInput');
        const confirmGoalBtn = document.getElementById('confirmGoalBtn');
        const cancelGoalBtn = document.getElementById('cancelGoalBtn');
        const focusToggle = document.getElementById('focusToggle');
        const appContainer = document.getElementById('appContainer');
        const counterBar = document.getElementById('counterBar');
        let saveTimeout;
        let isPreviewMode = false;
        let isFocusMode = false;
        let currentRenameTabId = null;

        const tabManager = new TabManager();

        // Tab modal toggle
        floatingTabButton.addEventListener('click', (e) => {
            e.stopPropagation();
            const isActive = tabModalBackdrop.classList.contains('active');
            if (isActive) {
                closeDropdown();
            } else {
                openDropdown();
            }
        });

        function openDropdown() {
            tabModalBackdrop.classList.add('active');
        }

        function closeDropdown() {
            tabModalBackdrop.classList.remove('active');
        }

        // Close modal when clicking backdrop
        tabModalBackdrop.addEventListener('click', (e) => {
            if (e.target === tabModalBackdrop) {
                closeDropdown();
            }
        });

        // Rename modal functions
        function openRenameModal(tabId) {
            currentRenameTabId = tabId;
            const tab = tabManager.tabs.find(t => t.id === tabId);
            if (tab) {
                renameInput.value = tab.title;
                renameModal.classList.add('active');
                setTimeout(() => {
                    renameInput.focus();
                    renameInput.select();
                }, 100);
            }
        }

        confirmRenameBtn.addEventListener('click', () => {
            const newTitle = renameInput.value.trim();
            if (newTitle && currentRenameTabId) {
                tabManager.renameTab(currentRenameTabId, newTitle);
                renameModal.classList.remove('active');
                currentRenameTabId = null;
            }
        });

        cancelRenameBtn.addEventListener('click', () => {
            renameModal.classList.remove('active');
            currentRenameTabId = null;
        });

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape') {
                if (renameModal.classList.contains('active')) {
                    renameModal.classList.remove('active');
                    currentRenameTabId = null;
                }
                if (goalModal.classList.contains('active')) {
                    goalModal.classList.remove('active');
                }
                if (tabModalBackdrop.classList.contains('active')) {
                    closeDropdown();
                }
            }
        });

        // Rename on enter
        renameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmRenameBtn.click();
            }
        });

        // Goal settings modal functions
        goalSettingsBtn.addEventListener('click', () => {
            const activeTab = tabManager.getActiveTab();
            if (activeTab) {
                charGoalInput.value = activeTab.charGoal || '';
                wordGoalInput.value = activeTab.wordGoal || '';
                goalModal.classList.add('active');
                setTimeout(() => charGoalInput.focus(), 100);
            }
        });

        confirmGoalBtn.addEventListener('click', () => {
            const charGoal = parseInt(charGoalInput.value) || 0;
            const wordGoal = parseInt(wordGoalInput.value) || 0;
            tabManager.setGoals(tabManager.activeTabId, charGoal, wordGoal);
            goalModal.classList.remove('active');
        });

        cancelGoalBtn.addEventListener('click', () => {
            goalModal.classList.remove('active');
        });

        // Save goals on enter
        charGoalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmGoalBtn.click();
            }
        });

        wordGoalInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmGoalBtn.click();
            }
        });

        // Update counters
        function updateCounters(manager = null) {
            const text = notepad.value;
            const tm = manager || (typeof tabManager !== 'undefined' ? tabManager : null);
            const activeTab = tm ? tm.getActiveTab() : null;
            const charProgressBar = document.getElementById('charProgressBar');
            const charProgress = document.getElementById('charProgress');
            const wordProgressBar = document.getElementById('wordProgressBar');
            const wordProgress = document.getElementById('wordProgress');

            // Character count
            const chars = text.length;
            if (activeTab && activeTab.charGoal) {
                const percentage = Math.min((chars / activeTab.charGoal) * 100, 100);
                charCount.textContent = `${chars.toLocaleString()} / ${activeTab.charGoal.toLocaleString()}`;

                // Show and update progress bar
                charProgress.classList.remove('hidden');
                charProgressBar.style.width = `${percentage}%`;

                // Color based on progress
                if (percentage >= 100) {
                    charCount.className = 'text-sm text-white font-bold tabular-nums';
                    charProgressBar.className = 'h-full bg-white transition-all duration-300';
                } else if (percentage >= 75) {
                    charCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                    charProgressBar.className = 'h-full bg-gray-300 transition-all duration-300';
                } else if (percentage >= 50) {
                    charCount.className = 'text-sm text-gray-300 font-semibold tabular-nums';
                    charProgressBar.className = 'h-full bg-gray-500 transition-all duration-300';
                } else {
                    charCount.className = 'text-sm text-gray-400 font-semibold tabular-nums';
                    charProgressBar.className = 'h-full bg-gray-700 transition-all duration-300';
                }
            } else {
                charCount.textContent = chars.toLocaleString();
                charCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                charProgress.classList.add('hidden');
            }

            // Word count
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            const wordCountValue = words.length;
            if (activeTab && activeTab.wordGoal) {
                const percentage = Math.min((wordCountValue / activeTab.wordGoal) * 100, 100);
                wordCount.textContent = `${wordCountValue.toLocaleString()} / ${activeTab.wordGoal.toLocaleString()}`;

                // Show and update progress bar
                wordProgress.classList.remove('hidden');
                wordProgressBar.style.width = `${percentage}%`;

                // Color based on progress
                if (percentage >= 100) {
                    wordCount.className = 'text-sm text-white font-bold tabular-nums';
                    wordProgressBar.className = 'h-full bg-white transition-all duration-300';
                } else if (percentage >= 75) {
                    wordCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                    wordProgressBar.className = 'h-full bg-gray-300 transition-all duration-300';
                } else if (percentage >= 50) {
                    wordCount.className = 'text-sm text-gray-300 font-semibold tabular-nums';
                    wordProgressBar.className = 'h-full bg-gray-500 transition-all duration-300';
                } else {
                    wordCount.className = 'text-sm text-gray-400 font-semibold tabular-nums';
                    wordProgressBar.className = 'h-full bg-gray-700 transition-all duration-300';
                }
            } else {
                wordCount.textContent = wordCountValue.toLocaleString();
                wordCount.className = 'text-sm text-gray-200 font-semibold tabular-nums';
                wordProgress.classList.add('hidden');
            }
        }

        // Update markdown preview
        function updateMarkdownPreview() {
            if (typeof marked !== 'undefined') {
                markdownPreview.innerHTML = marked.parse(notepad.value || '*No content to preview*');
            }
        }

        // Show saving indicator
        function showSavingIndicator() {
            const indicator = document.querySelector('.flex.items-center.gap-2.text-xs.text-gray-500');
            indicator.classList.remove('text-gray-500');
            indicator.classList.add('text-white');

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                indicator.classList.remove('text-white');
                indicator.classList.add('text-gray-500');
            }, 1000);
        }

        // Toggle markdown preview
        markdownToggle.addEventListener('click', () => {
            isPreviewMode = !isPreviewMode;
            if (isPreviewMode) {
                updateMarkdownPreview();
                notepad.classList.add('hidden');
                markdownPreview.classList.remove('hidden');
                markdownToggle.querySelector('span').textContent = 'Edit';
            } else {
                notepad.classList.remove('hidden');
                markdownPreview.classList.add('hidden');
                markdownToggle.querySelector('span').textContent = 'Preview';
            }
        });

        // Update counters on input
        notepad.addEventListener('input', () => {
            updateCounters();
            tabManager.saveCurrentTabContent();
            showSavingIndicator();
            if (isPreviewMode) {
                updateMarkdownPreview();
            }
        });

        // Handle tab key
        notepad.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = notepad.selectionStart;
                const end = notepad.selectionEnd;

                // Insert tab character
                notepad.value = notepad.value.substring(0, start) + '\t' + notepad.value.substring(end);

                // Move cursor after tab
                notepad.selectionStart = notepad.selectionEnd = start + 1;

                // Trigger input event to save and update counters
                notepad.dispatchEvent(new Event('input'));
            }
        });

        // Add smooth focus effect
        notepad.addEventListener('focus', () => {
            notepad.parentElement.parentElement.classList.add('ring-1', 'ring-gray-700');
        });

        notepad.addEventListener('blur', () => {
            notepad.parentElement.parentElement.classList.remove('ring-1', 'ring-gray-700');
        });

        // Save content before closing/refreshing
        window.addEventListener('beforeunload', () => {
            tabManager.saveCurrentTabContent();
        });

        // Focus Mode Toggle
        focusToggle.addEventListener('click', () => {
            isFocusMode = !isFocusMode;
            document.body.classList.toggle('focus-mode');

            if (isFocusMode) {
                // Activate Focus Mode
                focusToggle.classList.add('text-white');
                focusToggle.querySelector('span').textContent = 'Exit Focus';
            } else {
                // Deactivate Focus Mode
                focusToggle.classList.remove('text-white');
                focusToggle.querySelector('span').textContent = 'Focus';
            }
        });

        // Timer Logic
        const timerDisplay = document.getElementById('timerDisplay');
        const timerToggleBtn = document.getElementById('timerToggleBtn');
        const timerIcon = document.getElementById('timerIcon');

        let timerInterval;
        let timerSeconds = 0;
        let isTimerRunning = false;

        function formatTime(totalSeconds) {
            const hours = Math.floor(totalSeconds / 3600);
            const minutes = Math.floor((totalSeconds % 3600) / 60);
            const seconds = totalSeconds % 60;

            const pad = (num) => num.toString().padStart(2, '0');

            if (hours > 0) {
                return `${pad(hours)}:${pad(minutes)}:${pad(seconds)}`;
            }
            return `${pad(minutes)}:${pad(seconds)}`;
        }

        function updateTimerUI() {
            if (timerDisplay) {
                timerDisplay.textContent = formatTime(timerSeconds);
            }
        }

        function toggleTimer() {
            if (isTimerRunning) {
                // Stop (Pause)
                clearInterval(timerInterval);
                isTimerRunning = false;

                // Change icon to Play
                if (timerIcon) {
                    timerIcon.innerHTML = '<path fill-rule="evenodd" d="M10 18a8 8 0 100-16 8 8 0 000 16zM9.555 7.168A1 1 0 008 8v4a1 1 0 001.555.832l3-2a1 1 0 000-1.664l-3-2z" clip-rule="evenodd"></path>';
                }
                if (timerToggleBtn) {
                    timerToggleBtn.classList.remove('text-red-400', 'hover:text-red-300');
                    timerToggleBtn.classList.add('text-neutral-400', 'hover:text-white');
                }
            } else {
                // Start
                isTimerRunning = true;
                timerInterval = setInterval(() => {
                    timerSeconds++;
                    updateTimerUI();
                }, 1000);

                // Change icon to Stop/Pause
                if (timerIcon) {
                    timerIcon.innerHTML = '<path fill-rule="evenodd" d="M18 10a8 8 0 11-16 0 8 8 0 0116 0zM7 8a1 1 0 012 0v4a1 1 0 11-2 0V8zm5-1a1 1 0 00-1 1v4a1 1 0 102 0V8a1 1 0 00-1-1z" clip-rule="evenodd"></path>';
                }
                if (timerToggleBtn) {
                    timerToggleBtn.classList.remove('text-neutral-400', 'hover:text-white');
                    timerToggleBtn.classList.add('text-red-400', 'hover:text-red-300');
                }
            }
        }

        if (timerToggleBtn) {
            timerToggleBtn.addEventListener('click', toggleTimer);
        }
    </script>
</body>
</html>
