<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Minimalist Notepad</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
        textarea::-webkit-scrollbar,
        #markdownPreview::-webkit-scrollbar {
            width: 8px;
        }

        textarea::-webkit-scrollbar-track,
        #markdownPreview::-webkit-scrollbar-track {
            background: #1f2937;
        }

        textarea::-webkit-scrollbar-thumb,
        #markdownPreview::-webkit-scrollbar-thumb {
            background: #4b5563;
            border-radius: 4px;
        }

        textarea::-webkit-scrollbar-thumb:hover,
        #markdownPreview::-webkit-scrollbar-thumb:hover {
            background: #6b7280;
        }

        #markdownPreview {
            overflow-y: auto;
        }

        #markdownPreview h1 {
            font-size: 2em;
            font-weight: bold;
            margin: 0.67em 0;
        }

        #markdownPreview h2 {
            font-size: 1.5em;
            font-weight: bold;
            margin: 0.75em 0;
        }

        #markdownPreview h3 {
            font-size: 1.17em;
            font-weight: bold;
            margin: 0.83em 0;
        }

        #markdownPreview p {
            margin: 1em 0;
        }

        #markdownPreview ul, #markdownPreview ol {
            margin: 1em 0;
            padding-left: 2em;
        }

        #markdownPreview li {
            margin: 0.5em 0;
        }

        #markdownPreview code {
            background-color: #374151;
            padding: 0.2em 0.4em;
            border-radius: 3px;
            font-family: monospace;
        }

        #markdownPreview pre {
            background-color: #1f2937;
            padding: 1em;
            border-radius: 6px;
            overflow-x: auto;
            margin: 1em 0;
        }

        #markdownPreview pre code {
            background-color: transparent;
            padding: 0;
        }

        #markdownPreview blockquote {
            border-left: 4px solid #4b5563;
            padding-left: 1em;
            margin: 1em 0;
            color: #9ca3af;
        }

        #markdownPreview a {
            color: #60a5fa;
            text-decoration: underline;
        }

        #markdownPreview hr {
            border: none;
            border-top: 1px solid #4b5563;
            margin: 2em 0;
        }

        .modal {
            display: none;
            position: fixed;
            z-index: 1000;
            left: 0;
            top: 0;
            width: 100%;
            height: 100%;
            background-color: rgba(0, 0, 0, 0.7);
        }

        .modal.active {
            display: flex;
            align-items: center;
            justify-content: center;
        }

        .dropdown-menu {
            display: none;
            position: absolute;
            z-index: 100;
            background-color: #374151;
            border: 1px solid #4b5563;
            border-radius: 6px;
            box-shadow: 0 4px 6px rgba(0, 0, 0, 0.3);
            min-width: 150px;
        }

        .dropdown-menu.active {
            display: block;
        }

        .dropdown-menu button {
            width: 100%;
            padding: 0.5rem 1rem;
            text-align: left;
            transition: background-color 0.2s;
        }

        .dropdown-menu button:hover {
            background-color: #4b5563;
        }

        .dropdown-menu button:first-child {
            border-radius: 6px 6px 0 0;
        }

        .dropdown-menu button:last-child {
            border-radius: 0 0 6px 6px;
        }
    </style>
</head>
<body class="bg-gray-950 min-h-screen flex items-center justify-center p-4 md:p-8">
    <div class="w-full max-w-4xl h-[90vh] flex flex-col bg-gray-900 rounded-xl shadow-2xl overflow-hidden border border-gray-800">

        <!-- Counter Bar -->
        <div class="flex items-center justify-between px-6 py-4 bg-gray-800/50 border-b border-gray-700/50 backdrop-blur-sm">
            <div class="flex items-center gap-8">
                <!-- Character Counter -->
                <div class="flex items-center gap-3">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M9 12h6m-6 4h6m2 5H7a2 2 0 01-2-2V5a2 2 0 012-2h5.586a1 1 0 01.707.293l5.414 5.414a1 1 0 01.293.707V19a2 2 0 01-2 2z"></path>
                    </svg>
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-gray-400 font-medium">Characters</span>
                        <span class="text-sm text-gray-200 font-semibold tabular-nums" id="charCount">0</span>
                    </div>
                </div>

                <!-- Word Counter -->
                <div class="flex items-center gap-3">
                    <svg class="w-4 h-4 text-gray-400" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                    </svg>
                    <div class="flex items-center gap-2">
                        <span class="text-sm text-gray-400 font-medium">Words</span>
                        <span class="text-sm text-gray-200 font-semibold tabular-nums" id="wordCount">0</span>
                    </div>
                </div>
            </div>

            <div class="flex items-center gap-4">
                <!-- Tab Management -->
                <div class="flex items-center gap-2 relative">
                    <select id="tabDropdown" class="bg-gray-700 text-gray-200 text-sm rounded px-3 py-1.5 border border-gray-600 focus:outline-none focus:ring-1 focus:ring-gray-500 min-w-[150px]">
                        <!-- Options will be populated by JS -->
                    </select>
                    <button id="tabActionsBtn" class="bg-gray-700 hover:bg-gray-600 text-gray-200 p-1.5 rounded transition-colors">
                        <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                            <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 5v.01M12 12v.01M12 19v.01M12 6a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2zm0 7a1 1 0 110-2 1 1 0 010 2z"></path>
                        </svg>
                    </button>
                    <!-- Dropdown Menu -->
                    <div id="tabActionsMenu" class="dropdown-menu">
                        <button id="newTabAction" class="text-gray-200 text-sm flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M12 4v16m8-8H4"></path>
                            </svg>
                            New Tab
                        </button>
                        <button id="renameTabAction" class="text-gray-200 text-sm flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M11 5H6a2 2 0 00-2 2v11a2 2 0 002 2h11a2 2 0 002-2v-5m-1.414-9.414a2 2 0 112.828 2.828L11.828 15H9v-2.828l8.586-8.586z"></path>
                            </svg>
                            Rename Tab
                        </button>
                        <button id="deleteTabAction" class="text-red-400 text-sm flex items-center gap-2">
                            <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                                <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M19 7l-.867 12.142A2 2 0 0116.138 21H7.862a2 2 0 01-1.995-1.858L5 7m5 4v6m4-6v6m1-10V4a1 1 0 00-1-1h-4a1 1 0 00-1 1v3M4 7h16"></path>
                            </svg>
                            Delete Tab
                        </button>
                    </div>
                </div>

                <!-- Markdown Toggle -->
                <button id="markdownToggle" class="flex items-center gap-2 text-xs text-gray-400 hover:text-gray-200 transition-colors px-3 py-1.5 rounded hover:bg-gray-800">
                    <svg class="w-4 h-4" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M15 12a3 3 0 11-6 0 3 3 0 016 0z"></path>
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M2.458 12C3.732 7.943 7.523 5 12 5c4.478 0 8.268 2.943 9.542 7-1.274 4.057-5.064 7-9.542 7-4.477 0-8.268-2.943-9.542-7z"></path>
                    </svg>
                    <span class="font-medium">Preview</span>
                </button>

                <!-- Auto-save indicator -->
                <div class="flex items-center gap-2 text-xs text-gray-500">
                    <svg class="w-3.5 h-3.5" fill="currentColor" viewBox="0 0 20 20">
                        <path fill-rule="evenodd" d="M16.707 5.293a1 1 0 010 1.414l-8 8a1 1 0 01-1.414 0l-4-4a1 1 0 011.414-1.414L8 12.586l7.293-7.293a1 1 0 011.414 0z" clip-rule="evenodd"></path>
                    </svg>
                    <span class="font-medium">Auto-saved</span>
                </div>
            </div>
        </div>

        <!-- Editor/Preview Container -->
        <div class="flex-1 relative overflow-hidden">
            <!-- Textarea -->
            <textarea
                id="notepad"
                placeholder="Start typing..."
                autofocus
                class="absolute inset-0 w-full h-full bg-gray-900 text-gray-100 placeholder-gray-600 px-8 py-6 text-base md:text-lg leading-relaxed resize-none outline-none focus:ring-0 font-mono"
            ></textarea>

            <!-- Markdown Preview -->
            <div id="markdownPreview" class="absolute inset-0 w-full h-full bg-gray-900 text-gray-100 px-8 py-6 text-base md:text-lg leading-relaxed hidden">
            </div>
        </div>
    </div>

    <!-- Rename Modal -->
    <div id="renameModal" class="modal">
        <div class="bg-gray-800 rounded-lg p-6 w-full max-w-md border border-gray-700">
            <h3 class="text-xl font-semibold text-gray-100 mb-4">Rename Tab</h3>
            <input
                type="text"
                id="renameInput"
                class="w-full bg-gray-700 text-gray-100 px-4 py-2 rounded border border-gray-600 focus:outline-none focus:ring-2 focus:ring-gray-500 mb-4"
                placeholder="Enter tab name..."
            />
            <div class="flex justify-end gap-3">
                <button id="cancelRenameBtn" class="px-4 py-2 bg-gray-700 hover:bg-gray-600 text-gray-200 rounded transition-colors">
                    Cancel
                </button>
                <button id="confirmRenameBtn" class="px-4 py-2 bg-blue-600 hover:bg-blue-700 text-white rounded transition-colors">
                    Rename
                </button>
            </div>
        </div>
    </div>

    <script>
        // Tab Management
        class TabManager {
            constructor() {
                this.tabs = [];
                this.activeTabId = null;
                this.loadTabs();
                this.init();
            }

            init() {
                if (this.tabs.length === 0) {
                    this.createTab();
                } else {
                    this.activeTabId = this.tabs[0].id;
                    this.renderDropdown();
                    this.loadActiveTab();
                }
            }

            loadTabs() {
                const savedTabs = localStorage.getItem('notepadTabs');
                if (savedTabs) {
                    this.tabs = JSON.parse(savedTabs);
                }
                const savedActiveTab = localStorage.getItem('activeTabId');
                if (savedActiveTab) {
                    this.activeTabId = savedActiveTab;
                }
            }

            saveTabs() {
                localStorage.setItem('notepadTabs', JSON.stringify(this.tabs));
                localStorage.setItem('activeTabId', this.activeTabId);
            }

            createTab() {
                const newTab = {
                    id: Date.now().toString(),
                    title: `Note ${this.tabs.length + 1}`,
                    content: ''
                };
                this.tabs.push(newTab);
                this.activeTabId = newTab.id;
                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
            }

            switchTab(tabId) {
                // Save current tab content before switching
                this.saveCurrentTabContent();
                this.activeTabId = tabId;
                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
            }

            renameTab(tabId, newTitle) {
                const tab = this.tabs.find(t => t.id === tabId);
                if (tab && newTitle.trim()) {
                    tab.title = newTitle.trim();
                    this.saveTabs();
                    this.renderDropdown();
                }
            }

            deleteTab(tabId) {
                if (this.tabs.length === 1) {
                    alert('Cannot delete the last tab');
                    return;
                }

                const tabIndex = this.tabs.findIndex(t => t.id === tabId);
                this.tabs.splice(tabIndex, 1);

                // Switch to another tab
                if (this.activeTabId === tabId) {
                    const newActiveIndex = Math.min(tabIndex, this.tabs.length - 1);
                    this.activeTabId = this.tabs[newActiveIndex].id;
                }

                this.saveTabs();
                this.renderDropdown();
                this.loadActiveTab();
            }

            saveCurrentTabContent() {
                const activeTab = this.tabs.find(t => t.id === this.activeTabId);
                if (activeTab) {
                    activeTab.content = notepad.value;
                    this.saveTabs();
                }
            }

            loadActiveTab() {
                const activeTab = this.tabs.find(t => t.id === this.activeTabId);
                if (activeTab) {
                    notepad.value = activeTab.content;
                    updateCounters();
                    updateMarkdownPreview();
                }
            }

            renderDropdown() {
                const tabDropdown = document.getElementById('tabDropdown');

                // Render dropdown options
                tabDropdown.innerHTML = this.tabs.map(tab => `
                    <option value="${tab.id}" ${tab.id === this.activeTabId ? 'selected' : ''}>
                        ${tab.title}
                    </option>
                `).join('');
            }

            getActiveTab() {
                return this.tabs.find(t => t.id === this.activeTabId);
            }
        }

        // Initialize
        const notepad = document.getElementById('notepad');
        const markdownPreview = document.getElementById('markdownPreview');
        const markdownToggle = document.getElementById('markdownToggle');
        const charCount = document.getElementById('charCount');
        const wordCount = document.getElementById('wordCount');
        const tabDropdown = document.getElementById('tabDropdown');
        const tabActionsBtn = document.getElementById('tabActionsBtn');
        const tabActionsMenu = document.getElementById('tabActionsMenu');
        const renameModal = document.getElementById('renameModal');
        const renameInput = document.getElementById('renameInput');
        const confirmRenameBtn = document.getElementById('confirmRenameBtn');
        const cancelRenameBtn = document.getElementById('cancelRenameBtn');
        const newTabAction = document.getElementById('newTabAction');
        const renameTabAction = document.getElementById('renameTabAction');
        const deleteTabAction = document.getElementById('deleteTabAction');
        let saveTimeout;
        let isPreviewMode = false;

        const tabManager = new TabManager();

        // Update counters
        function updateCounters() {
            const text = notepad.value;

            // Character count
            charCount.textContent = text.length.toLocaleString();

            // Word count
            const words = text.trim().split(/\s+/).filter(word => word.length > 0);
            wordCount.textContent = words.length.toLocaleString();
        }

        // Update markdown preview
        function updateMarkdownPreview() {
            if (typeof marked !== 'undefined') {
                markdownPreview.innerHTML = marked.parse(notepad.value || '*No content to preview*');
            }
        }

        // Show saving indicator
        function showSavingIndicator() {
            const indicator = document.querySelector('.flex.items-center.gap-2.text-xs.text-gray-500');
            indicator.classList.remove('text-gray-500');
            indicator.classList.add('text-green-500');

            clearTimeout(saveTimeout);
            saveTimeout = setTimeout(() => {
                indicator.classList.remove('text-green-500');
                indicator.classList.add('text-gray-500');
            }, 1000);
        }

        // Toggle markdown preview
        markdownToggle.addEventListener('click', () => {
            isPreviewMode = !isPreviewMode;
            if (isPreviewMode) {
                updateMarkdownPreview();
                notepad.classList.add('hidden');
                markdownPreview.classList.remove('hidden');
                markdownToggle.querySelector('span').textContent = 'Edit';
            } else {
                notepad.classList.remove('hidden');
                markdownPreview.classList.add('hidden');
                markdownToggle.querySelector('span').textContent = 'Preview';
            }
        });

        // Tab actions menu toggle
        tabActionsBtn.addEventListener('click', (e) => {
            e.stopPropagation();
            tabActionsMenu.classList.toggle('active');

            // Position the menu
            const rect = tabActionsBtn.getBoundingClientRect();
            tabActionsMenu.style.top = (rect.bottom + 5) + 'px';
            tabActionsMenu.style.left = (rect.left - 100) + 'px';
        });

        // Close menu when clicking outside
        document.addEventListener('click', (e) => {
            if (!tabActionsMenu.contains(e.target) && e.target !== tabActionsBtn) {
                tabActionsMenu.classList.remove('active');
            }
        });

        // New tab action
        newTabAction.addEventListener('click', () => {
            tabManager.createTab();
            tabActionsMenu.classList.remove('active');
        });

        // Rename tab action
        renameTabAction.addEventListener('click', () => {
            const activeTab = tabManager.getActiveTab();
            if (activeTab) {
                renameInput.value = activeTab.title;
                renameModal.classList.add('active');
                renameInput.focus();
                renameInput.select();
            }
            tabActionsMenu.classList.remove('active');
        });

        // Delete tab action
        deleteTabAction.addEventListener('click', () => {
            if (confirm('Are you sure you want to delete this tab?')) {
                tabManager.deleteTab(tabManager.activeTabId);
            }
            tabActionsMenu.classList.remove('active');
        });

        // Rename modal confirm
        confirmRenameBtn.addEventListener('click', () => {
            const newTitle = renameInput.value.trim();
            if (newTitle) {
                tabManager.renameTab(tabManager.activeTabId, newTitle);
                renameModal.classList.remove('active');
            }
        });

        // Rename modal cancel
        cancelRenameBtn.addEventListener('click', () => {
            renameModal.classList.remove('active');
        });

        // Close modal on escape
        document.addEventListener('keydown', (e) => {
            if (e.key === 'Escape' && renameModal.classList.contains('active')) {
                renameModal.classList.remove('active');
            }
        });

        // Rename on enter
        renameInput.addEventListener('keydown', (e) => {
            if (e.key === 'Enter') {
                confirmRenameBtn.click();
            }
        });

        // Tab dropdown change
        tabDropdown.addEventListener('change', (e) => {
            tabManager.switchTab(e.target.value);
        });

        // Update counters on input
        notepad.addEventListener('input', () => {
            updateCounters();
            tabManager.saveCurrentTabContent();
            showSavingIndicator();
            if (isPreviewMode) {
                updateMarkdownPreview();
            }
        });

        // Handle tab key
        notepad.addEventListener('keydown', (e) => {
            if (e.key === 'Tab') {
                e.preventDefault();
                const start = notepad.selectionStart;
                const end = notepad.selectionEnd;

                // Insert tab character
                notepad.value = notepad.value.substring(0, start) + '\t' + notepad.value.substring(end);

                // Move cursor after tab
                notepad.selectionStart = notepad.selectionEnd = start + 1;

                // Trigger input event to save and update counters
                notepad.dispatchEvent(new Event('input'));
            }
        });

        // Add smooth focus effect
        notepad.addEventListener('focus', () => {
            notepad.parentElement.parentElement.classList.add('ring-1', 'ring-gray-700');
        });

        notepad.addEventListener('blur', () => {
            notepad.parentElement.parentElement.classList.remove('ring-1', 'ring-gray-700');
        });

        // Save content before closing/refreshing
        window.addEventListener('beforeunload', () => {
            tabManager.saveCurrentTabContent();
        });
    </script>
</body>
</html>
